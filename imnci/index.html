/* IMNCI Case Assistant: EWS brand tokens (dr-abhishekpanda-cm.app/brand/ews.css) with a dark variant.
 * Booklet colours (pink/yellow/green) are clinical signals and stay identical in both themes. */
:root {
  --paper: #F4F5F1; --paper-2: #ECEEE7; --card: #FAFBF7;
  --ink: #15201B; --ink-soft: #4B5A52; --ink-faint: #7B877E;
  --line: #D7DCD1; --line-soft: #E4E7DD;
  --primary: #0C5E4E; --primary-deep: #08493C; --on-primary: #F4F5F1;
  --accent: #BE651F; --accent-tint: #F0E2D2;
  --danger: #A23B2B; --danger-tint: #F3DEDA; --info: #3D6E7A; --info-tint: #DDE9EC; --ok-tint: #DCEBE5;
  --pink: #FF99CC; --yellow: #FFFF99; --green: #92D050; --chip-ink: #15201B; --note: #D7DCD1;
  --grid-line: #D7DCD1; --grid-op: .32; --grain: rgba(12, 94, 78, .06);
  --shadow: 0 1px 2px rgba(21, 32, 27, .04), 0 10px 30px -18px rgba(21, 32, 27, .28);
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --maxw: 1180px; --gutter: clamp(16px, 4vw, 48px); --r: 14px; --r-sm: 9px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1513; --paper-2: #141D19; --card: #18221E;
    --ink: #E6EBE4; --ink-soft: #AEBBB3; --ink-faint: #7F8D86;
    --line: #2C3934; --line-soft: #222E29;
    --primary: #4DB39A; --primary-deep: #3A9A83; --on-primary: #0B1210;
    --accent: #E59457; --accent-tint: #3A2A1D;
    --danger: #E57B69; --danger-tint: #3B211D; --info: #86B9C6; --info-tint: #1C2D32; --ok-tint: #17302A;
    --note: #3A4741; --grid-line: #2C3934; --grid-op: .45; --grain: rgba(77, 179, 154, .07);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 30px -18px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1513; --paper-2: #141D19; --card: #18221E;
  --ink: #E6EBE4; --ink-soft: #AEBBB3; --ink-faint: #7F8D86;
  --line: #2C3934; --line-soft: #222E29;
  --primary: #4DB39A; --primary-deep: #3A9A83; --on-primary: #0B1210;
  --accent: #E59457; --accent-tint: #3A2A1D;
  --danger: #E57B69; --danger-tint: #3B211D; --info: #86B9C6; --info-tint: #1C2D32; --ok-tint: #17302A;
  --note: #3A4741; --grid-line: #2C3934; --grid-op: .45; --grain: rgba(77, 179, 154, .07);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 30px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; min-height: 100vh; }
.grid-bg { position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: 34px 34px; opacity: var(--grid-op);
  -webkit-mask-image: radial-gradient(120% 90% at 70% 0%, #000 30%, transparent 78%); mask-image: radial-gradient(120% 90% at 70% 0%, #000 30%, transparent 78%); }
.grain { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .5; background: radial-gradient(160% 120% at 80% -10%, var(--grain), transparent 45%); }

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 3.2vw, 2.2rem); }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 .6em; }
a { color: var(--primary); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.soft { color: var(--ink-soft); }
.faint { color: var(--ink-faint); }
.small { font-size: .85rem; }
.nowrap { white-space: nowrap; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* section headings inside cards (v1.1: plain headings, no eyebrow labels) */
.sec-h { font-family: var(--font-body); font-size: 1.02rem; font-weight: 600; line-height: 1.3; color: var(--ink); margin: 0 0 12px; letter-spacing: 0; }

/* ---------------------------------------------------------------- app bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--paper) 88%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: var(--maxw); margin: 0 auto; padding: 10px var(--gutter); display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 1.08rem; line-height: 1.1; }
.brand-sub { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .1em; color: var(--ink-faint); }
.nav { display: flex; gap: 2px; margin-left: auto; }
.nav button { background: none; border: 0; padding: 8px 12px; border-radius: 999px; cursor: pointer; color: var(--ink-soft); font-size: .9rem; display: flex; gap: 7px; align-items: center; }
.nav button svg { width: 17px; height: 17px; }
.nav button[aria-current="page"] { background: var(--card); color: var(--primary); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
.nav button .badge { margin-left: 2px; }
.tabbar { display: none; }
@media (max-width: 860px) {
  .nav { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabbar button { background: none; border: 0; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; color: var(--ink-faint); cursor: pointer; position: relative; }
  .tabbar button svg { width: 21px; height: 21px; }
  .tabbar button[aria-current="page"] { color: var(--primary); font-weight: 600; }
  .tabbar .badge { position: absolute; top: 3px; left: 54%; }
  main { padding-bottom: 28px !important; }
  .credit .credit-in { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}

main { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); padding-block: 22px 40px; }
.credit { border-top: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 92%, transparent); }
.credit-in { max-width: var(--maxw); margin: 0 auto; padding: 14px var(--gutter) 22px; font-size: .8rem; line-height: 1.55; color: var(--ink-soft);
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.credit-text { min-width: 0; }
.credit-in p { margin: 0; max-width: 90ch; }
.credit-fb { flex: none; }
.nw { white-space: nowrap; }
.credit-block { margin-top: 10px; font-size: .9rem; line-height: 1.55; }
.credit-block p { margin: 0; }
.credit-block a { color: var(--primary); text-underline-offset: 2px; word-break: break-word; }
.steps-list { margin: 8px 0 0; padding-left: 1.4em; }
.steps-list li { margin: 7px 0; }
.exp-row { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.exp-row .grow { min-width: 0; }
.exp-row p { margin: 2px 0 0; }
.exp-row .btn { flex: none; }
.fb-out { width: 100%; margin-top: 10px; font-family: var(--font-mono); font-size: .82rem; }
.credit a { color: var(--primary); text-underline-offset: 2px; word-break: break-word; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-bottom: 18px; }
.view-head .grow { flex: 1 1 260px; min-width: 0; }
.view-head p { color: var(--ink-soft); margin: 6px 0 0; max-width: 70ch; }

/* ---------------------------------------------------------------- buttons, pills, inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  padding: 8px 15px; cursor: pointer; font-weight: 500; font-size: .9rem; line-height: 1.2; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink-faint); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-deep); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--primary); }
.btn.ghost:hover { background: var(--paper-2); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.sm { padding: 5px 11px; font-size: .82rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-family: var(--font-mono); font-size: .66rem; font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); background: var(--card); white-space: nowrap; }
.pill.teal { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); }
.pill.amber { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-tint); }
.pill.red { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); background: var(--danger-tint); }
.pg { font-family: var(--font-mono); font-size: .66rem; color: var(--primary); border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--line)); border-radius: 5px; padding: 0 5px; white-space: nowrap; }

input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-sm); padding: 9px 11px; min-height: 40px; }
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
input.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; max-width: 150px; }
input.warn { border-color: var(--accent); }
.inline-inputs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inline-inputs > * { flex: 0 1 auto; }

      'Thrush after 2 days: look for ulcers or white patches in the mouth and reassess feeding. If thrush is worse, or the infant has problems with attachment or suckling, refer to hospital. If thrush is the same or better and the infant is feeding well, continue gentian violet 0.25% / clotrimazole for a total of 5 days.'] },
    ch_pneumonia: { title: 'PNEUMONIA, after 2 days', page: 37, items: [
      'Check the child for general danger signs. Assess the child for cough or difficult breathing.',
      'Ask: is the child breathing slower? Is there chest indrawing? Is there less fever? Is the child eating better?',
      'If a general danger sign or stridor, refer URGENTLY to hospital.',
      'If breathing rate, chest indrawing, fever and eating are the same or worse, refer to hospital.',
      'If breathing slower, no chest indrawing, less fever, or eating better, complete the 5 days of antibiotic course.'] },
    ch_persistent: { title: 'PERSISTENT DIARRHOEA, after 5 days', page: 37, items: [
      'Ask: has the diarrhoea stopped? How many loose stools is the child having per day?',
      'If the diarrhoea has not stopped (3 or more loose stools per day), do a full reassessment of the child, give any treatment needed, then refer to hospital.',
      'If the diarrhoea has stopped (less than 3 loose stools per day), tell the mother to follow the usual feeding recommendations for the child\'s age. Continue oral zinc for a total of 14 days.'] },
    ch_no_dehydration: { title: 'DIARRHOEA, after 5 days', page: 37, items: [
      'Ask: has the diarrhoea stopped? How many loose stools is the child having per day?',
      'If diarrhoea persists, assess the child for diarrhoea (ASSESS & CLASSIFY chart) and manage as on initial visit.',
      'If diarrhoea has stopped (less than 3 loose stools per day), tell the mother to follow the usual feeding recommendations for the child\'s age.'] },
    ch_dysentery: { title: 'DYSENTERY, after 2 days', page: 37, items: [
      'Assess the child for diarrhoea. Ask: are there fewer stools? Is there less blood in the stool? Is there less fever? Is there less abdominal pain? Is the child eating better?',
      'If the child is dehydrated, treat dehydration.',
      'If number of stools, amount of blood in stools, fever, abdominal pain or eating is the same or worse, refer to hospital.',
      'If fewer stools, less blood in the stools, less fever, less abdominal pain and eating better, continue giving cefixime until finished. Ensure the mother understands the oral rehydration method and the need for an extra meal each day for a week.'] },
    ch_malaria: { title: 'MALARIA/SUSPECTED MALARIA, after 2 days', page: 38, items: [
      'Do a full reassessment of the child (ASSESS & CLASSIFY chart). Review the test report. Assess for other causes of fever.',
      'If the child has any general danger sign or stiff neck, treat as VERY SEVERE FEBRILE DISEASE.',
      'If the child has any cause of fever other than malaria, provide treatment.',
      'If malaria is the only apparent cause of fever, advise the mother to return again in 2 days if the fever persists. Continue primaquine if P. vivax was positive for a total of 14 days.'] },
    ch_fever_malaria_unlikely: { title: 'FEVER - MALARIA UNLIKELY, if fever persists after 2 days', page: 38, items: [
      'Do a full reassessment of the child (ASSESS & CLASSIFY chart). Assess for other causes of fever.',
      'If the child has any general danger sign or stiff neck, treat as VERY SEVERE FEBRILE DISEASE.',
      'If the child has any cause of fever other than malaria, provide treatment.',
      'If malaria is the only apparent cause of fever, treat with the oral antimalarial. Advise the mother to return again in 2 days if the fever persists.'] },
    ch_dengue: { title: 'DENGUE FEVER', page: 38, items: [
      'Reassess for warning signs.',
      'If any general danger signs or warning signs, refer URGENTLY to hospital.',
      'If no general danger sign and no warning signs, follow up after 2 days.',
      'If fever has been present for 7 days, refer for assessment.'] },
    ch_measles_complications: { title: 'MEASLES WITH EYE OR MOUTH COMPLICATIONS, after 2 days', page: 38, items: [
      'Look for red eyes and pus draining from the eyes. Look at mouth ulcers. Check for foul smell from the mouth.',
      'Eye: if pus is draining, ask how the mother has treated the eye infection. If treatment has been correct, refer to hospital; if not, teach correct treatment. If pus is gone but redness remains, continue. If no pus or redness, stop the treatment.',
      'Mouth: if ulcers are worse or there is a very foul smell from the mouth, refer to hospital. If the same or better, continue half-strength gentian violet for a total of 5 days.'] },
    ch_acute_ear: { title: 'EAR INFECTION, after 5 days', page: 38, items: [
      'Reassess for ear problem. Measure the child\'s temperature.',
      'If there is tender swelling behind the ear or high fever (38.5°C or above), refer URGENTLY to hospital.',
      'Acute ear infection: if ear pain or discharge persists, treat with 5 more days of the same antibiotic. Continue wicking to dry the ear. Follow-up in 5 days.',
      'If no ear pain or discharge, praise the mother. If she has not finished the 5 days of antibiotic, tell her to use all of it before stopping.'] },
    ch_chronic_ear: { title: 'CHRONIC EAR INFECTION, after 5 days', page: 38, items: [
      'Reassess for ear problem. Measure the child\'s temperature.',
      'If there is tender swelling behind the ear or high fever (38.5°C or above), refer URGENTLY to hospital.',
      'Check that the mother is wicking the ear correctly and instilling ear drops. If ear discharge is getting better, encourage her to continue. If no improvement, refer to hospital for assessment.'] },
    ch_feeding_problem: { title: 'FEEDING PROBLEM, after 5 days', page: 39, items: [
      'Reassess feeding (questions at the top of the COUNSEL chart). Ask about any feeding problems found on the initial visit.',
      'Counsel the mother about any new or continuing feeding problems. If you counsel the mother to make significant changes in feeding, ask her to bring the child back again.'] },
    ch_mam: { title: 'MODERATE ACUTE MALNUTRITION, after 30 days', page: 39, items: [
      'Assess the child using the same measurement (WFH/L or MUAC) used on the initial visit. Check for oedema of both feet. Reassess feeding.',
      'If no longer MODERATE ACUTE MALNUTRITION, praise the mother and encourage her to continue.',
      'If still MODERATE ACUTE MALNUTRITION, counsel about any feeding problem found. Ask the mother to return again in one month. Continue to see the child monthly until feeding well and gaining weight regularly, or WFH/L ≥ -2 SD and/or MUAC ≥ 12.5 cm.',
      'Exception: if you do not think feeding will improve, or the child has lost weight or MUAC has fallen below 11.5 cm, refer for assessment of medical causes like TB, HIV.'] },
    ch_anemia: { title: 'ANEMIA, after 14 days', page: 39, items: [
      'Check compliance and allay anxiety if black stools or minor side effects. Do haemoglobin estimation if possible.',
      'If improvement, give iron folic acid. Advise the mother to return in 14 days for more. Continue giving iron folic acid every 14 days for 2-3 months.',
      'If no improvement, check compliance. Refer to test for sickle cell anaemia and haemoglobinopathies if family history present or common in that population.',
      'If there is anaemia even after 2 months of supplementation, refer to hospital for assessment.'] },
    ch_sam: { title: 'UNCOMPLICATED SEVERE ACUTE MALNUTRITION, after 7 days', page: 39, items: [
      'Do a full reassessment with the same measurements (WFH/L, MUAC) as on the initial visit; look for oedema of both feet.',
      'If COMPLICATED SAM (WFH/L < -3 SD or MUAC < 11.5 cm or oedema of both feet AND a medical complication), refer URGENTLY. If static weight or weight loss at 2 consecutive follow-up visits, refer for assessment of medical causes like TB, HIV.',
      'If UNCOMPLICATED SAM, counsel the mother and encourage appropriate feeding. Ask the mother to return again in 14 days.',
      'If MODERATE ACUTE MALNUTRITION, advise appropriate feeding and see the child monthly until feeding well and gaining weight, and WFH/L ≥ -2 SD and/or MUAC ≥ 12.5 cm.'] }
  };
  // NO PNEUMONIA: COUGH OR COLD has no follow-up box (p.37): a child who returns not improving is reassessed in full.
  FOLLOWUP_CARE.ch_some_dehydration = FOLLOWUP_CARE.ch_no_dehydration;
  // the young infant's DIARRHOEA box (p.15) serves both dehydration rows treated at the clinic
  FOLLOWUP_CARE.yi_some_dehydration = FOLLOWUP_CARE.yi_no_dehydration;

    { label: '1 week up to 6 months', fromDays: 7, toMonths: 6, play: 'Provide ways for your child to see, hear, feel, move freely, and touch you. Slowly move colourful things for your child to see and reach for. Sample toys: shaker rattle, big ring on a string.', talk: 'Smile and laugh with your child. Talk to your child. Get a conversation going by copying your child\'s sounds or gestures.' },
    { label: '6 months up to 9 months', fromMonths: 6, toMonths: 9, play: 'Give your child clean, safe household things to handle, bang and drop. Sample toys: containers with lids, metal pot and spoon.', talk: 'Respond to your child\'s sounds and interests. Call the child\'s name and see your child respond.' },
    { label: '9 months up to 12 months', fromMonths: 9, toMonths: 12, play: 'Hide a child\'s favourite toy under a cloth or box. See if the child can find it. Play peek-a-boo.', talk: 'Tell your child the names of things and people. Show your child how to say things with hands, like "bye bye". Sample toy: doll with face.' },
    { label: '12 months up to 2 years', fromMonths: 12, toMonths: 24, play: 'Give your child things to stack up and to put into containers and take out. Sample toys: nesting and stacking objects, container and clothes clips.', talk: 'Ask your child simple questions. Respond to your child\'s attempts to talk. Show and talk about nature, pictures and things.' },

    { id: 'notBreastfeed', label: 'Mother does not breastfeed', page: 35, advice: ['Hold the child close when feeding, look at the child and talk or sing to the child.'] },

  // Reference cards: short how-to text reached from treatment items.
  var REF = {
    yi_clinic: { title: 'Give these treatments in clinic only (young infant)', page: 9, items: [
      'Explain to the mother why the drug is given. Determine the dose appropriate for the infant\'s weight (or age). Use a sterile needle and sterile syringe; measure the dose accurately. Give the drug as an intramuscular injection.',
      'Give first dose of both ampicillin and gentamicin intramuscularly.'] },
    yi_noreferral: { title: 'If referral is not possible (young infant)', page: 9, items: [
      'Referral is the best option for a young infant classification with POSSIBLE SERIOUS BACTERIAL INFECTION, DIARRHOEA WITH SEVERE DEHYDRATION, SOME DEHYDRATION AND LOW WEIGHT / VERY LOW WEIGHT FOR AGE.',
      'If referral is not possible or refused, give oral amoxicillin (25-30 mg/kg) every 12 hours and intramuscular gentamicin once daily.',
      'At each contact for injection of antibiotics, explain again to the caregiver that the infant is very sick and should urgently be referred for hospital care.',
      'If referral is still not possible, continue giving once-daily intramuscular gentamicin and twice-daily oral amoxicillin until referral is feasible or for 7 days.',
      'Urgent referral is also needed in SEVERE JAUNDICE. Explain and counsel for urgent referral at each visit.'] },
    yi_lowsugar: { title: 'Treat the young infant to prevent low blood sugar', page: 9, items: [
      'If able to breastfeed: ask the mother to breastfeed.',
      'If not able to breastfeed but able to swallow: give 20-50 ml (10 ml/kg) of expressed breastmilk or locally appropriate animal milk (with added sugar) before departure. If neither is available, give 20-50 ml (10 ml/kg) of sugar water.',
      'To make sugar water: dissolve 4 level teaspoons of sugar (20 grams) in a 200 ml cup of clean water.',
      'If not able to swallow: give 20-50 ml (10 ml/kg) of expressed breastmilk, animal milk (with added sugar) or sugar water by nasogastric tube.'], see: ['yi_express'] },
    yi_warm: { title: 'Keep the young infant warm', page: 10, items: [
      'Warm the young infant using skin to skin contact (Kangaroo Mother Care): provide privacy (father or any other adult can give skin to skin contact if the mother is not available); undress the baby except for cap, nappy and socks; place the baby prone on the mother\'s chest, upright, between her breasts, head turned to one side; cover baby with mother\'s blouse, pallu or gown and a blanket or shawl; breastfeed frequently; warm the room (>25°C/77°F) if possible.',
      'If skin to skin contact is not possible: clothe the baby in 3-4 layers, cover head with a cap, put gloves and socks, cover with a soft dry cloth and a blanket or shawl; hold the baby close to the caregiver\'s body.',
      'On the way to the hospital: skin to skin contact, or clothe the baby in 3-4 layers, cover head with a cap and body with a blanket or shawl, and hold the baby close.'] },
    yi_oral: { title: 'Teach the mother to give oral drugs at home', page: 11, items: [
      'Determine the appropriate drugs and dosage for the infant\'s age or weight. Tell the mother the reason for giving the drug.',
      'Demonstrate how to measure a dose; watch her measure a dose; ask her to give the first dose.',
      'Explain how to give the drug, then label and pack it. Pack each drug separately.',
      'Explain that all the tablets or syrup must be used to finish the course, even if the infant gets better. Check her understanding before she leaves.'] },
    yi_local: { title: 'Treat skin pustules or umbilical infection at home', page: 11, items: [
      'Explain how the treatment is given; watch her give the first treatment; she should return if the infection worsens.',
      'Apply gentian violet paint twice daily. The mother should wash hands; gently wash off pus and crusts with soap and water; dry the area and paint with gentian violet 0.5% or antibacterial ointment; wash hands again.'] },
    yi_homecare: { title: 'Home care for the young infant', page: 11, items: [
      'Immediately after birth, the baby should be put on the mother\'s abdomen for skin to skin contact.',
      'Start breastfeeding within one hour of birth.',
      'Breastfeed day and night as often as the baby wants, at least 8 times in 24 hours. Frequent feeding produces more milk.',
      'If the baby is small (low birth weight), feed him or her at least every 2-3 hours. Wake the baby for feeding after 3 hours if she or he does not wake up.',
      'Look for signs of hunger, such as beginning to fuss, sucking fingers or moving lips.',
      'Do not give other foods or fluids. Breast milk is all the baby needs.',
      'Make sure the young infant stays warm at all times. In cool weather, cover the infant\'s head and feet and dress the infant with extra clothing.',
      'Wash hands with soap and water after defecation and after cleaning the baby\'s bottom.',
      'Do not apply anything on the cord; keep the umbilical cord dry.'] },
    yi_express: { title: 'How to express breastmilk', page: 12, items: [
      'The mother should wash her hands, sit comfortably and hold a cup or katori under the nipple and areola.',
      'Place her thumb on the top of the breast and the first finger on the underside of the breast, opposite each other, at least 4 cm from the tip of the nipple.',
      'Compress and release the breast tissue between her finger and thumb a few times.',
      'If the milk does not appear, re-position the thumb and finger closer to the nipple and compress and release the breast as before.',
      'Compress and release all the way round the breast, keeping the fingers the same distance from the nipple.',
      'Be careful not to squeeze the nipple, rub the skin, or move the thumb or finger on the skin.',
      'Express one breast until the milk just drips, then express the other breast until the milk just drips.',
      'Alternate 5-6 times between the breasts for at least 20-30 minutes.'] },
    yi_return: { title: 'When to return (young infant)', page: 14, items: [] },
    yi_attach: { title: 'Correct positioning and attachment', page: 12, items: [
      'Hold the infant with head and body straight, facing her breast with the nose opposite her nipple, body close to her body, supporting the whole body.',
      'Help the infant attach: touch the infant\'s lips with the nipple, wait until the mouth opens wide, move the infant quickly onto the breast aiming the lower lip well below the nipple.',
      'Look for signs of good attachment and effective suckling. If not good, try again.'] },
    yi_cupspoon: { title: 'Cup and spoon feeding; replacement feeds', page: 12, items: [
      'Prepare milk correctly and hygienically.',
      'Hold the infant upright; put a cloth on the neck and upper trunk; put a measured amount of milk in the cup; rest the cup lightly on the lower lip and tilt it so the milk just reaches the lips. Let the infant take the milk; do not pour it into the mouth.'], see: ['yi_express'] },
    yi_thrush: { title: 'Treat thrush', page: 12, items: [
      'Twice daily: wash hands; wipe the mouth with a clean soft cloth wrapped around a finger and wet with salt water; paint the mouth with gentian violet 0.25% or 2-3 drops of clotrimazole mouth paint on the white patches; wash hands again.'] },
    yi_breast: { title: 'Breast or nipple problems', page: 13, items: [
      'Flat or inverted nipple: evert the nipple several times with fingers before each feed.',
      'Sore nipple: apply breast milk; ensure correct positioning and attachment. If discomfort continues, feed expressed breast milk with a cup.',
      'Engorged breasts: let the baby continue to suck; if not suckling effectively, help the mother express milk, then put the infant to the breast. A warm compress may help.',
      'Breast abscess: feed from the other breast and refer to a surgeon. If the infant wants more milk, feed undiluted animal milk with added sugar by cup and spoon.'], see: ['yi_express', 'yi_cupspoon'] },
    yi_lowwt_warm: { title: 'Keep a low weight infant warm at home', page: 13, items: [
      'Do not bathe; sponge with lukewarm water. Provide skin to skin contact day and night as much as possible.',
      'When skin to skin is not possible: room warm (>25°C/77°F); 3-4 layers of clothes, cap, gloves and socks; baby and mother together on soft thick bedding; extra quilt in cold weather.',
      'Feel the feet of the baby periodically; they should always be warm to touch.'] },
    ch_im: { title: 'Intramuscular antibiotics (child) and referral', page: 22, items: [
      'Referral is the best option for GENERAL DANGER SIGNS, SEVERE PNEUMONIA/VERY SEVERE DISEASE, SEVERE DEHYDRATION, VERY SEVERE FEBRILE DISEASE, SEVERE COMPLICATED MEASLES, SEVERE DENGUE, MASTOIDITIS, SEVERE ACUTE MALNUTRITION WITH MEDICAL COMPLICATIONS AND SEVERE ANEMIA.',
      'If referral is not possible or refused, give oral amoxicillin (25-30 mg/kg) every 12 hours and intramuscular gentamicin once daily in cases requiring antibiotics. At each contact, explain again that the child is very sick and should urgently be referred.',
      'If referral is still not possible, continue once-daily intramuscular gentamicin and twice-daily intramuscular ampicillin until referral is feasible or for 7 days (wording as printed on p.22).'] },
    ch_diazepam: { title: 'Diazepam to stop convulsions', page: 22, items: [] },
    ch_severe_malaria: { title: 'IM artesunate or quinine for severe malaria', page: 22, items: [
      'For children being referred with VERY SEVERE FEBRILE DISEASE: give the first dose and refer urgently. If IM artesunate is not available, give a single rectal dose of artesunate (10 mg/kg) using tab artesunate.',
      'If referral is not possible: repeat artesunate after 12 hours and daily until the child can take orally, then give a full oral antimalarial course. For quinine: the child should remain lying down for one hour; repeat at 4 and 8 hours, then every 12 hours until able to take oral antimalarial; not more than 1 week. If low risk of malaria, do not give quinine to a child less than 4 months of age.'] },
    ch_salbutamol: { title: 'Inhaled salbutamol and spacers', page: 23, items: [
      'A spacer delivers the drug effectively into the lungs; it works as well as a nebuliser if correctly used. A spacer can be made from a 500 ml drink bottle (hole in the base for the inhaler mouthpiece) or a plastic cup for a small baby.',
      'Remove the cap, shake the inhaler, insert the mouthpiece through the hole; the child breathes in and out through the opening while a carer sprays one puff; wait three to four breaths and repeat. Prime a new spacer with 4-5 extra puffs.'] },
    ch_lowsugar: { title: 'Treat the child to prevent low blood sugar', page: 23, items: [

      else if (someHit.length >= 2) { var sd1 = make('yi_some_dehydration', someHit); if (dmiss.length) { sd1.provisional = true; sd1.missing = dmiss; } out.push(sd1); }
      else if (!dmiss.length) out.push(make('yi_no_dehydration', ['Not enough signs to classify as some or severe dehydration']));
      else ctx.pending.push({ table: 'yi_dehydration', missing: dmiss });
      if (yes(y.bloodStool)) ctx.alerts.push({ id: 'yi_blood', type: 'danger', refer: 'refer', text: 'Blood in stool in a young infant needs referral to a hospital to rule out surgical and medical causes (p.6).' });
    } else if (!known(y.diarrhoea)) ctx.pending.push({ table: 'yi_dehydration', missing: ['does the young infant have diarrhoea?'], optional: true });

    // ---- feeding problem or low weight for age (p.7)
    var w = ctx.weight;
    var wfa = y.wfaManual ? { band: y.wfaManual, manual: true } : wfaYoungInfant((c.pt || {}).sex, age, w, ctx.settings);
    d.wfa = wfa;
    var lowWeight = wfa ? (wfa.band === 'lt3' || wfa.band === 'lt2') : null;
    var vlwReasons = [];
    if (under7 === true && w !== null && w < 1.8) vlwReasons.push('Weight ' + fmtNum(w, 2) + ' kg (less than 1800 g) in an infant less than 7 days');
    else if (under7 === true && w === null && yes(y.lt1800)) vlwReasons.push('Weight less than 1800 g (recorded) in an infant less than 7 days');
    if (under7 === false && wfa && wfa.band === 'lt3') vlwReasons.push('Weight for age less than -3 SD in an infant 7-59 days old');
    // p.7: all four signs must be present for good attachment, so any sign recorded "No" means not well attached
    var fourSigns = [y.chin, y.mouth, y.lip, y.areola];
    var anySignNo = fourSigns.some(no);
    var attachProblem = y.attach ? (y.attach === 'none' || y.attach === 'notwell') : null;
    if (attachProblem === false && anySignNo) {
      attachProblem = true;
      notes.push({ type: 'warn', text: 'Attachment was recorded as good, but not all four signs of good attachment were seen (p.7): classified as not well attached.' });
    }

    }
    var suckleProblem = y.suckle ? (y.suckle === 'none' || y.suckle === 'noteff') : null;
    var bfTimes = num(y.bfTimes);
    var bfLess8 = yes(y.breastfed) && bfTimes !== null ? bfTimes < 8 : (no(y.breastfed) ? false : null);
    var breastProblem = yes(y.nipple) || yes(y.engorged);
    var fpSigns = [];
    if (attachProblem === true) fpSigns.push(y.attach === 'none' ? 'No attachment at all' : 'Not well attached to breast');
    if (suckleProblem === true) fpSigns.push(y.suckle === 'none' ? 'Not suckling at all' : 'Not suckling effectively');
    if (bfLess8 === true) fpSigns.push('Less than 8 breastfeeds in 24 hours (' + bfTimes + ')');
    if (yes(y.otherFoods)) fpSigns.push('Receives other foods or drinks');
    if (no(y.breastfed)) fpSigns.push('Not breastfeeding at all');
    if (yes(y.thrush)) fpSigns.push('Thrush (ulcers or white patches in mouth)');
    if (lowWeight === true) fpSigns.push('Low weight for age (' + (wfa.manual ? 'recorded' : BAND_TEXT[wfa.band]) + ')');
    if (breastProblem) fpSigns.push('Breast or nipple problems');
    ctx.flags.yiLowWeight = lowWeight === true || vlwReasons.length > 0 ? true : (lowWeight === false ? false : null);
    ctx.flags.yiAttachProblem = attachProblem === true || suckleProblem === true ? true : (attachProblem === false && suckleProblem === false ? false : null);
    ctx.flags.yiBfLess8 = bfLess8;
    ctx.flags.yiOtherFoods = known(y.otherFoods) ? yes(y.otherFoods) : null;
    ctx.flags.yiNotBreastfed = known(y.breastfed) ? no(y.breastfed) : null;
    ctx.flags.yiThrush = known(y.thrush) ? yes(y.thrush) : null;
    ctx.flags.yiBreastProblem = breastProblem;
    ctx.flags.yiFeedProblemOrThrush = (attachProblem === true || suckleProblem === true || bfLess8 === true || yes(y.otherFoods) || no(y.breastfed) || yes(y.thrush) || breastProblem);
    if (y.attach === 'none' || y.suckle === 'none') {
      notes.push({ type: 'warn', text: 'An infant who cannot attach or suckle at all is not able to feed, a sign of POSSIBLE SERIOUS BACTERIAL INFECTION OR VERY SEVERE DISEASE (p.4). Check the infection table.' });
    }
    var fmiss = [];
    need(fmiss, under7 === null, 'age in days');
    need(fmiss, w === null && !(under7 === true && known(y.lt1800)), 'weight');
    need(fmiss, !wfa && under7 === false, 'weight for age (sex, age and weight)');
    need(fmiss, !known(y.breastfed), 'breastfed?');
    need(fmiss, yes(y.breastfed) && bfTimes === null, 'number of breastfeeds in 24 hours');
    need(fmiss, !known(y.otherFoods), 'other foods or drinks');
    need(fmiss, !known(y.thrush), 'thrush');
    // breastfeeding assessment indication (p.7)
    ctx.indications.bfAssess = (yes(y.feedDifficulty) || bfLess8 === true || yes(y.otherFoods) || lowWeight === true) && vlwReasons.length === 0;
    if (vlwReasons.length) out.push(make('yi_very_low_weight', vlwReasons));
    else if (fpSigns.length) out.push(make('yi_feeding_problem', fpSigns));
    else if (yes(nfw)) {
      // not feeding well is a sign of POSSIBLE SERIOUS BACTERIAL INFECTION (p.4), not a NO FEEDING PROBLEM infant

    } else if (!fmiss.length) {
      var nf = make('yi_no_feeding_problem', ['Not low weight for age and no other signs of inadequate feeding']);
      if (ctx.indications.bfAssess && !y.attach) { nf.provisional = true; nf.missing = ['breastfeeding assessment']; }
      out.push(nf);
    } else ctx.pending.push({ table: 'yi_feeding', missing: fmiss });

  }

  // ================================================================= SICK CHILD
  function classifyChild(c, ctx) {
    var h = c.ch || {};
    var out = [];
    var notes = ctx.notes, d = ctx.derived, age = ctx.age;
    var months = age.months;

    // ---- general danger signs (p.16)
    var gdsList = [
      [yes(h.notAbleDrink), 'Not able to feed /drink'], [yes(h.vomitsAll), 'Vomits everything'],
      [yes(h.lethargic), 'Lethargy/unconscious'], [yes(h.convulsions), 'Convulsions'], [yes(h.convulsingNow), 'Convulsing now']
    ];
    var gdsHit = gdsList.filter(function (s) { return s[0]; }).map(function (s) { return s[1]; });
    var gdsKnown = [h.notAbleDrink, h.vomitsAll, h.lethargic, h.convulsions].every(known);
    var gds = gdsHit.length ? true : (gdsKnown ? false : null);
    d.gds = gds;
    if (gds) out.push(make('ch_vsd', gdsHit));
    else if (gds === null) ctx.pending.push({ table: 'ch_danger', missing: ['all four general danger signs'] });

    // ---- cough or difficult breathing (p.17)
    if (yes(h.cough)) {
      var rr = num(h.rr), ci = known(h.chestIndrawing) ? yes(h.chestIndrawing) : null;
      var threshold = months === null ? null : (months < 12 ? 50 : 40);
      var fast = rr === null || threshold === null ? null : rr >= threshold;
      var wheezeTrialIndicated = yes(h.wheeze) && (fast === true || ci === true);
      d.fastThreshold = threshold;
      if (wheezeTrialIndicated) {
        if (yes(h.bdTrial)) {
          var rrA = num(h.rrAfter);
          if (rrA !== null && threshold !== null) fast = rrA >= threshold;
          if (known(h.ciAfter)) ci = yes(h.ciAfter);
          notes.push({ type: 'info', text: 'Classified on the breath count and chest indrawing after the bronchodilator trial (p.17).' });
        } else {
          notes.push({ type: 'warn', text: 'Wheezing with fast breathing or chest indrawing: give a trial of rapid acting inhaled bronchodilator for up to three times 15-20 minutes apart. Count the breaths and look for chest indrawing again, and then classify (p.17).' });
        }
      }
      d.fast = fast; d.rr = rr;
      var sevR = [];
      if (gds) sevR.push('Any general danger sign');
      if (yes(h.stridor)) sevR.push('Stridor in calm child');
      var spo2v = num(h.spo2Value);
      if (h.spo2 === 'lt90' || (spo2v !== null && spo2v < 90)) sevR.push('SpO2 < 90%' + (spo2v !== null ? ' (' + spo2v + '%)' : ''));
      var cmiss = [];
      need(cmiss, rr === null, 'breath count'); need(cmiss, ci === null, 'chest indrawing'); need(cmiss, !known(h.stridor), 'stridor');
      need(cmiss, months === null, 'age'); need(cmiss, gds === null, 'general danger signs');
      // p.17: with wheezing, give the bronchodilator trial "and then classify", so until then PNEUMONIA is provisional
      var tmiss = [];
      if (wheezeTrialIndicated) {
        if (!known(h.bdTrial)) tmiss.push('bronchodilator trial, then count breaths and look for chest indrawing again (p.17)');
        else if (yes(h.bdTrial)) {
          need(tmiss, num(h.rrAfter) === null, 'breath count after the bronchodilator trial');
          need(tmiss, !known(h.ciAfter), 'chest indrawing after the bronchodilator trial');
        }
      }
      if (sevR.length) out.push(make('ch_severe_pneumonia', sevR));
      else {
        var pR = [];
        if (ci === true) pR.push('Chest indrawing');
        if (fast === true) pR.push('Fast breathing (' + (yes(h.bdTrial) && num(h.rrAfter) !== null ? num(h.rrAfter) : rr) + '/min; threshold ' + threshold + '/min for age)');
        if (pR.length) { var pnc = make('ch_pneumonia', pR); if (cmiss.length || tmiss.length) { pnc.provisional = true; pnc.missing = cmiss.concat(tmiss); } out.push(pnc); }
        else if (!cmiss.length) { var ccl = make('ch_cough_cold', ['No signs of severe pneumonia or pneumonia']); if (tmiss.length) { ccl.provisional = true; ccl.missing = tmiss; } out.push(ccl); }
        else ctx.pending.push({ table: 'ch_cough', missing: cmiss });
      }
      ctx.flags.coughOver14 = num(h.coughDays) === null ? null : num(h.coughDays) > 14;
    }

    // ---- diarrhoea (p.18)
    var dehydClass = null;
    if (yes(h.diarrhoea)) {
      var dc = h.dCondition;
      var sev = [
        [dc === 'lethargic', 'Lethargic or unconscious'], [yes(h.sunkenEyes), 'Sunken eyes'],
        [h.drink === 'poor', 'Not able to drink or drinking poorly'], [h.skinPinch === 'veryslow', 'Skin pinch goes back very slowly']
      ];
      var some = [
        [dc === 'restless' || dc === 'lethargic', dc === 'restless' ? 'Restless, irritable' : 'Lethargic (counts as restless or worse)'],
        [yes(h.sunkenEyes), 'Sunken eyes'],
        [h.drink === 'eager' || h.drink === 'poor', h.drink === 'eager' ? 'Drinks eagerly, thirsty' : 'Drinking poorly (counts as thirst sign)'],
        [h.skinPinch === 'slow' || h.skinPinch === 'veryslow', h.skinPinch === 'slow' ? 'Skin pinch goes back slowly' : 'Skin pinch very slow (counts as slowly)']
      ];
      var dmiss = [];
      need(dmiss, !dc, 'general condition'); need(dmiss, !known(h.sunkenEyes), 'sunken eyes'); need(dmiss, !h.drink, 'drinking'); need(dmiss, !h.skinPinch, 'skin pinch');
      var sh = sev.filter(function (s) { return s[0]; }).map(function (s) { return s[1]; });
      var so = some.filter(function (s) { return s[0]; }).map(function (s) { return s[1]; });
      if (sh.length >= 2) dehydClass = make('ch_severe_dehydration', sh);
      else if (so.length >= 2) { dehydClass = make('ch_some_dehydration', so); if (dmiss.length) { dehydClass.provisional = true; dehydClass.missing = dmiss; } }
      else if (!dmiss.length) dehydClass = make('ch_no_dehydration', ['Not enough signs to classify as some or severe dehydration']);
      else ctx.pending.push({ table: 'ch_dehydration', missing: dmiss });
      if (dehydClass) out.push(dehydClass);
      var dd = num(h.dDays);
      if (dd !== null && dd >= 14) {

    }

    // ---- fever (p.19): by history, feels hot, or axillary temperature 37.5°C/99.5°F or above
    var feverByTemp = ctx.tempC !== null && ctx.tempC >= 37.5;
    if (feverByTemp && !yes(h.fever)) notes.push({ type: 'warn', text: 'Axillary temperature ' + fmtNum(ctx.tempC) + '°C is 37.5°C or above, so the child has fever: assess and classify fever (p.19).' });
    d.fever = yes(h.fever) || feverByTemp ? true : (no(h.fever) ? false : null);
    if (d.fever) {
      var rdt = h.rdt || '';
      var rdtPos = rdt === 'pf' || rdt === 'pv' || rdt === 'mixed';
      // dengue and measles are classified first because both count as other causes of fever (p.19, footnote **)
      var dengueCls = null, measlesCls = null;
      if (yes(h.dengueSeason) && yes(h.contFever27)) {
        var dw = [];
        if (gds) dw.push('Any general danger sign');
        if (yes(h.coldExt)) dw.push('Cold extremities');
        if (yes(h.abdPain)) dw.push('Severe abdominal pain');
        if (yes(h.bleeding)) dw.push('Bleeding from any site');
        if (h.tourniquet === 'pos') dw.push('Positive tourniquet test');
        if (dw.length) dengueCls = make('ch_severe_dengue', dw);
        else {
          var dmiss2 = [];
          need(dmiss2, !known(h.coldExt), 'cold extremities'); need(dmiss2, !known(h.abdPain), 'severe abdominal pain');
          need(dmiss2, !known(h.bleeding), 'bleeding'); need(dmiss2, !h.tourniquet, 'tourniquet test'); need(dmiss2, gds === null, 'general danger signs');
          dengueCls = make('ch_dengue', ['Dengue season with continuous fever of 2-7 days', 'No warning signs']);
          if (dmiss2.length) { dengueCls.provisional = true; dengueCls.missing = dmiss2; }
        }
      } else if (yes(h.dengueSeason) && !known(h.contFever27)) {
        ctx.pending.push({ table: 'ch_dengue', missing: ['continuous fever of 2-7 days (dengue season)'] });
      }
      var measlesNow = yes(h.rash) && yes(h.crr);
      if (measlesNow || yes(h.measlesHx)) {
        var mR = measlesNow ? 'Measles now (generalised rash with cough, runny nose or red eyes)' : 'Measles within the last 3 months';
        var ms = [];
        if (gds) ms.push('Any general danger sign');
        if (yes(h.cornea)) ms.push('Clouding of cornea');
        if (h.mouthUlcers === 'deep') ms.push('Deep or extensive mouth ulcers');
        if (ms.length) measlesCls = make('ch_severe_measles', [mR].concat(ms));
        else if (yes(h.eyePus) || h.mouthUlcers === 'present') {
          var mm = [mR];
          if (yes(h.eyePus)) mm.push('Pus draining from the eye');
          if (h.mouthUlcers === 'present') mm.push('Mouth ulcers');
          measlesCls = make('ch_measles_complications', mm);
        } else {
          measlesCls = make('ch_measles', [mR]);
          var mmiss = [];
          need(mmiss, !h.mouthUlcers, 'mouth ulcers'); need(mmiss, !known(h.eyePus), 'pus draining from the eye');
          need(mmiss, !known(h.cornea), 'clouding of cornea'); need(mmiss, gds === null, 'general danger signs');
          if (mmiss.length) { measlesCls.provisional = true; measlesCls.missing = mmiss; }
        }
      }

      // other obvious causes of fever: no pneumonia: cough or cold, pneumonia, diarrhoea, dysentery, dengue, measles (p.19 **)
      var causeIds = ['ch_cough_cold', 'ch_pneumonia', 'ch_severe_pneumonia', 'ch_dysentery'];
      var derivedCauses = [];
      out.forEach(function (x) { if (causeIds.indexOf(x.id) >= 0) derivedCauses.push(KB.CLS_BY_ID[x.id].name); });
      if (yes(h.diarrhoea) && !out.some(function (x) { return x.id === 'ch_dysentery'; })) derivedCauses.push('DIARRHOEA');
      if (dengueCls) derivedCauses.push(KB.CLS_BY_ID[dengueCls.id].name);
      if (measlesCls) derivedCauses.push('MEASLES');
      if (yes(h.bactFocus)) derivedCauses.push('bacterial focus of fever');
      var otherCause = yes(h.otherCause) || derivedCauses.length ? true : (no(h.otherCause) ? false : null);
      if (no(h.otherCause) && derivedCauses.length) notes.push({ type: 'info', text: derivedCauses.join(', ') + ' counts as another cause of fever (p.19, footnote **).' });
      var causeText = derivedCauses.length ? 'Other cause of fever: ' + derivedCauses.join(', ') : 'Other cause of fever present';

      var mal = null, fmiss = [];
      if (gds || yes(h.stiffNeck)) {
        var vr = [];
        if (gds) vr.push('Any general danger sign');
        if (yes(h.stiffNeck)) vr.push('Stiff neck');
        mal = make('ch_vsfd', vr);
      } else if (rdtPos) {
        mal = make('ch_malaria', ['Positive RDT (' + { pf: 'P. falciparum', pv: 'P. vivax', mixed: 'mixed Pf + Pv' }[rdt] + ')']);
      } else if (rdt === 'neg' || rdt === 'na' || rdt === 'nd') {
        if (otherCause === false) mal = make('ch_malaria', [(rdt === 'neg' ? 'RDT negative' : 'RDT not available or not done') + ' and no other obvious cause of fever']);
        else if (otherCause === true) mal = make('ch_fever_malaria_unlikely', (rdt === 'neg' ? ['Negative RDT'] : []).concat([causeText]));
        // a negative or missing RDT fits both rows until other causes are known: the upper row needs "no other obvious cause"
        else fmiss.push('other obvious cause of fever');
      } else if (otherCause === true) {
        mal = make('ch_fever_malaria_unlikely', [causeText]);
        if (!no(h.pfArea)) { mal.provisional = true; mal.missing = ['malaria RDT result (RDT is done in all fever cases in PF predominant areas)']; }

        need(fmiss, !rdt, 'malaria RDT result');
        need(fmiss, otherCause === null, 'other obvious cause of fever');
      }
      if (mal && mal.id !== 'ch_vsfd') {
        var vmiss = [];
        need(vmiss, !known(h.stiffNeck), 'stiff neck'); need(vmiss, gds === null, 'general danger signs');
        if (vmiss.length) { mal.provisional = true; mal.missing = (mal.missing || []).concat(vmiss); }
      }
      if (mal) out.push(mal);
      else { need(fmiss, !known(h.stiffNeck), 'stiff neck'); ctx.pending.push({ table: 'ch_malaria', missing: fmiss }); }
      if (yes(h.pfArea) && (rdt === 'nd' || rdt === '')) notes.push({ type: 'warn', text: 'PF predominant area: do RDT for malaria in all fever cases (p.19).' });
      var feverDays = num(h.feverDays);
      ctx.flags.feverDailyOver7 = feverDays === null ? null : (feverDays > 7 && yes(h.feverEveryDay));
      if (dengueCls) out.push(dengueCls);
      if (measlesCls) out.push(measlesCls);
    }

    // ---- ear problem (p.20)
    if (yes(h.ear)) {
      var ed = num(h.earDays);
      var emiss = [];
      if (yes(h.mastoid)) out.push(make('ch_mastoiditis', ['Tender swelling behind the ear']));
      else if ((yes(h.earPus) && ed !== null && ed < 14) || yes(h.earPain)) {
        var ar = [];
        if (yes(h.earPus) && ed !== null && ed < 14) ar.push('Pus draining from the ear, discharge for ' + ed + ' days (less than 14 days)');
        if (yes(h.earPain)) ar.push('Ear pain');

      } else if (no(h.earPain) && no(h.earPus) && known(h.mastoid)) {
        out.push(make('ch_no_ear', ['No ear pain', 'No pus seen draining from the ear']));
      } else {
        need(emiss, !known(h.earPain), 'ear pain'); need(emiss, !known(h.earPus), 'pus draining'); need(emiss, !known(h.mastoid), 'tender swelling behind the ear');
        need(emiss, yes(h.earPus) && ed === null, 'how long the discharge has been present');
        ctx.pending.push({ table: 'ch_ear', missing: emiss });
      }
    }
    return out;
  }

  // Malnutrition (p.20) and anaemia (p.21) depend on each other through "any severe classification",
  // so they are resolved together by fixed-point iteration over the other tables' results.
  function classifyNutritionAnemia(c, ctx, others) {
    var h = c.ch || {};
    var months = ctx.age.months;
    var d = ctx.derived;
    var w = ctx.weight;
    var length = num(h.length);
    var wfl = h.wflManual ? { band: h.wflManual, manual: true } : wfLengthHeight((c.pt || {}).sex, length, w, ctx.settings);
    if (wfl && wfl.outOfRange) { ctx.notes.push({ type: 'warn', text: 'Length/height ' + wfl.cm + ' cm is outside the booklet tables (45-120 cm): record the WFH/L band manually.' }); wfl = null; }
    d.wfl = wfl;
    var muac = months !== null && months >= 6 ? num(h.muac) : null;
    if (months !== null && months < 6 && num(h.muac) !== null) ctx.notes.push({ type: 'info', text: 'MUAC is measured from 6 months of age (p.20); the value entered is not used for classification.' });
    var mb = muacBand(muac);
    d.muacBand = mb;
    var oedema = known(h.oedema) ? yes(h.oedema) : null;

    var otherPink = others.filter(function (x) { return KB.CLS_BY_ID[x.id].sev === 'pink'; });
    var pneumonia = others.some(function (x) { return x.id === 'ch_pneumonia' || x.id === 'ch_severe_pneumonia'; });
    var dehydration = others.some(function (x) { return x.id === 'ch_some_dehydration' || x.id === 'ch_severe_dehydration'; });

    // Medical complications of SAM (p.20), with or without SEVERE ANEMIA among them.
    function complications(sevAnemia) {
      var list = [];
      if (ctx.derived.gds) list.push('Any general danger sign');
      otherPink.forEach(function (x) { if (x.id !== 'ch_vsd') list.push('Severe classification: ' + KB.CLS_BY_ID[x.id].name); });
      if (sevAnemia) list.push('Severe classification: SEVERE ANEMIA');
      if (pneumonia) list.push('Pneumonia');
      if (dehydration) list.push('Diarrhoea with dehydration');
      if (yes(h.poorAppetite)) list.push('Poor appetite');
      if (oedema) list.push('Oedema of both feet');
      return list;
    }
    var samWfl = wfl ? wfl.band === 'lt3' : null;
    var samMuac = mb ? mb === 'sam' : null;
    var mamWfl = wfl ? wfl.band === 'lt2' : null;
    var mamMuac = mb ? mb === 'mam' : null;
    var samCriteria = !!(samWfl || samMuac || oedema);

    // Anaemia (p.21): by Hb when it is tested and there is no other pink classification, else by palmar pallor.
    // SAM counts as "another pink classification" here only when it is complicated for a reason other than
    // severe anaemia; otherwise each row would decide the other in a circle.
    var pinkForHb = otherPink.length > 0 || (samCriteria && complications(false).length > 0);
    var hb = num(h.hb);
    var anemia = null;
    if (hb !== null && (!pinkForHb || !h.pallor)) {
      var hbTxt = 'Hb ' + fmtNum(hb) + ' g/dl';

  }

  function classifyChildFeeding(c, ctx, list) {

    var indicated = (months !== null && months < 24) || ids.indexOf('ch_mam') >= 0 || ids.indexOf('ch_sam') >= 0 || ids.indexOf('ch_anemia') >= 0;

    ctx.indications.devAssess = (months !== null && months < 36) || ids.indexOf('ch_sam') >= 0 || ids.indexOf('ch_anemia') >= 0;

  // ================================================================= conditions for treatment items
  var COND_TEXT = {

  function evalCond(key, ctx, selfId) {
    var c = ctx.case, y = c.yi || {}, h = c.ch || {}, f = ctx.flags, age = ctx.age;

      case 'convulsingNow': return c.group === 'yi' ? (known(y.convulsingNow) ? yes(y.convulsingNow) : null) : (known(h.convulsingNow) ? yes(h.convulsingNow) : null);
      case 'yiFastOrIndrawing': return ctx.derived.yiFast === true || yes(y.chestIndrawing) ? true : (ctx.derived.yiFast === false && no(y.chestIndrawing) ? false : null);
      case 'yiLowWtOrSevere': return anotherSevere || f.yiLowWeight === true ? true : (f.yiLowWeight === false ? false : null);

      case 'yiOtherFoods': return f.yiOtherFoods;
      case 'yiAttachProblem': return f.yiAttachProblem;
      case 'yiBfLess8': return f.yiBfLess8;
      case 'yiNotBreastfed': return f.yiNotBreastfed;
      case 'yiThrush': return f.yiThrush;
      case 'yiLowWeight': return f.yiLowWeight;
      case 'yiBreastProblem': return f.yiBreastProblem;
      case 'yiFeedProblemOrThrush': return f.yiFeedProblemOrThrush;
      case 'wheeze': return known(h.wheeze) ? yes(h.wheeze) : null;
      case 'age6mPlus': return age.months === null ? null : age.months >= 6;
      case 'coughOver14': return tri(f.coughOver14);
      case 'cholera2y': return !ctx.settings.cholera ? false : (age.months === null ? null : age.months >= 24);
      case 'pfAreaOrRdtPos': return yes(h.pfArea) || ['pf', 'pv', 'mixed'].indexOf(h.rdt) >= 0 ? true : (no(h.pfArea) && h.rdt ? false : null);
      case 'highFever': return ctx.tempC === null ? null : ctx.tempC >= 38.5;
      case 'feverDailyOver7': return tri(f.feverDailyOver7);

      case 'eyePus': return known(h.eyePus) ? yes(h.eyePus) : null;
      case 'mouthUlcers': return h.mouthUlcers ? h.mouthUlcers !== 'none' : null;
      case 'vitaNotLastMonth': return known(h.vitaLastMonth) ? no(h.vitaLastMonth) : null;
      case 'under2y': return age.months === null ? null : age.months < 24;
      case 'feedingProblem': return ctx.classes.some(function (x) { return x.id === 'ch_feeding_problem'; }) ? true : (ctx.classes.some(function (x) { return x.id === 'ch_no_feeding_problem'; }) ? false : null);

  }

  // ================================================================= doses
  var FRACTIONS = { '¼': 0.25, '½': 0.5, '¾': 0.75 };
  function inBand(x, band, top) { return x >= band[0] && (x < band[1] || (top && x <= band[1])); }

  // wasted child a dose meant for a heavier one: the booklet's mg/kg dose is used where it prints one.
  function perKgLabel(pk) { return (pk.mg[0] === pk.mg[1] ? pk.mg[0] : pk.mg[0] + '-' + pk.mg[1]) + ' mg/kg ' + pk.per; }

    var lo = pk.mg[0] * w, hi = pk.mg[1] * w;
    var range = function (a, b, dp) { return a === b ? fmtNum(a, dp) : fmtNum(a, dp) + '-' + fmtNum(b, dp); };
    var forms = (pk.forms || []).map(function (f) { return range(lo / f.mgPerMl, hi / f.mgPerMl, 2) + ' ml of ' + f.name; });

  }
  function tableDose(drug, ctx) {
    var w = ctx.weight, m = ctx.age.months;

    var who = ctx.case.group === 'yi' ? 'infant' : 'child';

      var r = rows[idx];
      return { ok: true, band: drug.labels[idx], basis: basis, values: r.v, cols: drug.cols, text: drug.cols.map(function (col, i) { return col + ': ' + r.v[i]; }).join('; '), note: note || null };
    }
    var byWeight = !drug.byAgeOnly && rows.some(function (r) { return r.w; });
    if (!byWeight || w === null) {
      var ai = m === null ? -1 : rows.findIndex(function (r, i) { return r.a && inBand(m, r.a, i === last); });
      if (ai >= 0) return pick(ai, 'age', byWeight ? 'No weight recorded: dose chosen by age. Weigh the ' + who + ': age is used only when the weight is not known (p.25).' : null);
      if (byWeight) return { ok: false, text: 'Weigh the ' + who + ' to choose the dose' + (drug.perKg ? ' (' + perKgLabel(drug.perKg) + ')' : '') + '.' };

    }

  }

  function calcDose(key, drug, ctx) {

      case 'ch_ceftriaxone':

      case 'ch_salbutamol':

        return { ok: true, text: 'Nebulised ' + fmtNum(Math.max(0.15 * w, 1.25), 2) + ' mg (0.15 mg/kg, minimum 1.25 mg) every 20 minutes for 3 doses in 3-4 ml normal saline; or 2-4 puffs (100 µg/puff) by MDI with spacer', basis: 'weight' };

        return { ok: true, text: 'Multivitamin ' + (w < 5 ? '2.5 ml' : '5 ml') + ' twice daily; zinc ' + fmtNum(2 * w, 1) + ' mg daily (2 mg/kg) for 2 weeks', basis: 'weight' };
      case 'planA':

          'If IV cannot be started here: refer URGENTLY if IV treatment is available within 30 minutes (sips of ORS on the way); if not, ORS by nasogastric tube (if trained) or by mouth, ' + fmtNum(20 * w, 0) + ' ml/hour for 6 hours (' + fmtNum(120 * w, 0) + ' ml); if neither is possible, refer URGENTLY for IV or NG treatment.' };

  function antimalarialDose(ctx, h, set) {

      if (ne) {

  // ================================================================= treatment resolution and plan

  // ------------------------------------------------------------------ practice quiz
  function quizTables(c) { return App.TABLE_ORDER[c.group].filter(function (t) { return t !== 'ch_feeding'; }); }
  function expected(c, r) {
    var exp = {};
    var pendingT = r.pending.filter(function (p) { return !p.optional; }).map(function (p) { return p.table; });
    quizTables(c).forEach(function (t) {
      var a = (r.autoClasses || []).filter(function (x) { return x.table === t; })[0];
      if (a) exp[t] = a.id; else if (pendingT.indexOf(t) >= 0) exp[t] = null; else exp[t] = 'none';
    });
    var ref = r.plan.referral;
    exp._referral = ref === 'urgent' ? 'urgent' : ref === 'after' || ref === 'refer' ? 'refer' : ref === 'urgent-conditional' ? null : 'none';
    return exp;
  }
  App.renderPracticeQuiz = function (c, r) {
    var ans = (c.practice && c.practice.answers) || {};
    var exp = expected(c, r);
    var html = '<p class="sec-h" role="heading" aria-level="2">Classify this ' + (c.group === 'yi' ? 'young infant' : 'child') + '</p><p class="soft">Use every table that applies. Choose "Not classified" when the main symptom is absent.</p><div style="display:grid;gap:10px">';
    quizTables(c).forEach(function (t) {
      var opts = App.clsOptions(t);
      html += '<label class="practice-q"><span><b>' + esc(KB.TABLES[t].title) + '</b> <span class="pg">p.' + KB.TABLES[t].page + '</span>' + (exp[t] === null ? ' <span class="pill amber">findings incomplete: not scored</span>' : '') + '</span>' +
        '<select data-quiz="' + t + '"><option value="">Choose…</option><option value="none"' + (ans[t] === 'none' ? ' selected' : '') + '>Not classified (symptom absent)</option>' +
        opts.map(function (o) { return '<option value="' + o.id + '"' + (ans[t] === o.id ? ' selected' : '') + '>' + esc(o.name) + '</option>'; }).join('') + '</select></label>';
    });
    html += '<label class="practice-q"><span><b>Referral decision</b></span><select data-quiz="_referral"><option value="">Choose…</option>' +
      [['urgent', 'Refer urgently'], ['refer', 'Refer, not urgently (or after rehydration)'], ['none', 'No referral (treat here)']].map(function (o) { return '<option value="' + o[0] + '"' + (ans._referral === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label></div>' +
      '<div class="btn-row" style="margin-top:14px"><button type="button" class="btn primary" data-act="quiz-submit">' + App.icon('check') + 'Check my answers</button><span class="small soft">Unanswered items count as wrong.</span></div>';
    return html;
  };
  function score(c, r) {
    var exp = expected(c, r), ans = c.practice.answers || {}, items = [];
    Object.keys(exp).forEach(function (t) {
      if (exp[t] === null) return;
      items.push({ t: t, want: exp[t], got: ans[t] || '', ok: (ans[t] || '') === exp[t] });
    });
    return { items: items, correct: items.filter(function (i) { return i.ok; }).length, total: items.length };
  }
  function practiceResult(c, r) {
    var s = score(c, r);
    var name = function (t, id) { return id === 'none' ? (t === '_referral' ? 'No referral (treat here)' : 'Not classified') : t === '_referral' ? ({ urgent: 'Refer urgently', refer: 'Refer, not urgently' }[id] || '—') : id ? KB.CLS_BY_ID[id].name : '—'; };
    return '<section class="card" style="margin-bottom:14px"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="score mono">' + s.correct + '/' + s.total + '</div><div><p class="sec-h" role="heading" aria-level="2" style="margin:0">Practice result</p><p class="soft" style="margin:0">' +
      (s.correct === s.total ? 'All correct.' : 'Compare your answers with the booklet classification below.') + '</p></div><div class="btn-row" style="margin-left:auto"><button type="button" class="btn sm" data-act="quiz-retry">Try again</button></div></div>' +
      '<div style="display:grid;gap:8px;margin-top:12px">' + s.items.map(function (i) {
        var title = i.t === '_referral' ? 'Referral decision' : KB.TABLES[i.t].title;
        return '<div class="practice-q ' + (i.ok ? 'right' : 'wrong') + '"><b>' + esc(title) + '</b><span class="small">Your answer: ' + esc(i.got ? name(i.t, i.got) : 'none given') + (i.ok ? '' : ' · Booklet: <b>' + esc(name(i.t, i.want)) + '</b>') + '</span></div>';
      }).join('') + '</div></section>';
  }

  // ------------------------------------------------------------------ sheets: override, reference cards, dose tables, follow-up
  function overrideSheet(c, table) {
    var r = App.result(c);
    var tables = table ? [table] : App.TABLE_ORDER[c.group];
    var cur = (c.overrides || {})[table] || {};
    var body = '<p class="soft small">The case summary, treatment and exports then follow your classification. The engine\'s classification is kept for the record.</p>';
    if (!table) body += '<label class="small" for="ov-table">Table</label><select id="ov-table">' + tables.map(function (t) { return '<option value="' + t + '">' + esc(KB.TABLES[t].title) + '</option>'; }).join('') + '</select>';
    body += '<label class="small" for="ov-cls" style="display:block;margin-top:10px">Classification</label><select id="ov-cls"></select>' +
      '<label class="small" for="ov-reason" style="display:block;margin-top:10px">Reason (kept with the case)</label><input type="text" id="ov-reason" value="' + esc(cur.reason || '') + '">';
    App.openSheet({
      title: table ? 'Change: ' + KB.TABLES[table].title : 'Add or change a classification',
      body: body,
      foot: ((c.overrides || {})[table] ? '<button type="button" class="btn danger" id="ov-restore">Restore the engine classification</button>' : '') + '<button type="button" class="btn" data-act="sheet-close">Cancel</button><button type="button" class="btn primary" id="ov-save">Save</button>',
      onOpen: function (ov) {
        var tSel = ov.querySelector('#ov-table'), cSel = ov.querySelector('#ov-cls');
        function fill() {
          var t = table || tSel.value;
          var auto = (r.autoClasses || []).filter(function (x) { return x.table === t; })[0];
          cSel.innerHTML = '<option value="none">Not classified (remove)</option>' + App.clsOptions(t).map(function (o) {
            var sel = cur.id ? cur.id === o.id : auto && auto.id === o.id;
            return '<option value="' + o.id + '"' + (sel ? ' selected' : '') + '>' + esc(o.name) + (auto && auto.id === o.id ? ' (engine)' : '') + '</option>';
          }).join('');
        }
        fill();
        if (tSel) tSel.addEventListener('change', fill);
        ov.querySelector('#ov-save').addEventListener('click', function () {
          var t = table || tSel.value;
          c.overrides = c.overrides || {};
          var auto = (r.autoClasses || []).filter(function (x) { return x.table === t; })[0];
          var id = cSel.value;
          if ((auto && auto.id === id) || (!auto && id === 'none')) delete c.overrides[t];
          else c.overrides[t] = { id: id, reason: ov.querySelector('#ov-reason').value.trim(), at: U.nowIso() };
          App.touch(c); App.saveCases(); App.closeSheet(); App.render();
        });
        var rs = ov.querySelector('#ov-restore');
        if (rs) rs.addEventListener('click', function () { delete c.overrides[table]; App.touch(c); App.saveCases(); App.closeSheet(); App.render(); });
      }
    });
  }

    var today = U.today(), n = 0;

      var r = App.result(c);

      case 'new-practice-go':
        App.closeSheet();
        var p = App.newCase(b.getAttribute('data-group'), { practice: { exerciseId: null, title: 'Practice case', brief: '', answers: {}, revealed: false } });
        App.cases.unshift(p); App.openCase(p.id, 0); break;
      case 'export-xlsx': App.exportXlsx(); break;
      case 'export-register-pdf': App.exportRegisterPdf(); break;
      case 'backup': App.exportBackup(App.cases); break;
      case 'restore': App.restoreBackup(); break;
      case 'export-menu': App.exportMenu(); break;
      case 'feedback': App.openFeedback(); break;
      case 'import-exercises': App.importExercises(); break;
      case 'demo-load':
        App.cases = App.cases.filter(function (c) { return !c.demo; }).concat(App.makeDemoCases(40));
        App.saveCases(); App.toast('40 demo cases loaded. Remove them from Settings.');
        if (App.ui.view === 'dashboard') { App.ui.dash = App.ui.dash || {}; App.ui.dash.demo = true; }
        App.render(); break;
      case 'demo-remove':
        App.cases = App.cases.filter(function (c) { return !c.demo; }); App.saveCases(); App.toast('Demo cases removed.'); App.render(); break;
      case 'wipe':
        App.confirm({ title: 'Delete all cases?', text: 'All ' + App.cases.length + ' cases in this browser will be deleted. Export a backup first if you need them.', ok: 'Delete all', danger: true, typeToConfirm: 'DELETE' }).then(function (ok) {
          if (!ok) return;
          App.cases = []; App.saveCases(); App.toast('All cases deleted.'); App.render();
        });
        break;
    }
  }

  App.start = function () {
    App.applyTheme();
    App.shell();
    if (App.ui.view === 'edit' || App.ui.view === 'summary') {
      var c = App.ui.caseId ? App.findCase(App.ui.caseId) : null;
      if (!c) App.ui.view = 'cases';
      else if (App.ui.view === 'edit') { App.wiz.caseId = c.id; }
    }
    App.render();
    App.on('downloads', function () { if (['cases', 'dashboard', 'summary', 'settings'].indexOf(App.ui.view) >= 0 && !document.getElementById('sheet')) App.render(); });
    App.initDownloads();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.start); else App.start();
})(IMNCI.App, IMNCI.Engine, IMNCI.KB);

</script>
