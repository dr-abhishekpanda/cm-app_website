<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not found — Dr. Abhishek Panda</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#F4F5F1;--ink:#15201B;--ink-soft:#4B5A52;--ink-faint:#7B877E;--line:#D7DCD1;--primary:#0C5E4E}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;padding:24px;text-align:center}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.32;
    background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);
    background-size:34px 34px;-webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 80%);mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 80%)}
  .code{font-family:"IBM Plex Mono",monospace;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--primary);margin-bottom:18px}
  h1{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(2.6rem,9vw,4.4rem);letter-spacing:-.03em;line-height:1;margin:0 0 14px}
  h1 em{font-style:italic;color:var(--primary)}
  p{color:var(--ink-soft);max-width:42ch;margin:0 auto 28px}
  a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:.92rem;
    padding:12px 20px;border-radius:100px;background:var(--primary);color:var(--paper)}
</style>
</head>
<body>
  <div>
    <div class="code">Error 404 · sample not found</div>
    <h1>This page <em>isn't here</em></h1>
    <p>The link may be broken, or the page may have moved. Let's get you back to the start.</p>
    <a class="btn" href="/">← Back to home</a>
  </div>
</body>
</html>
