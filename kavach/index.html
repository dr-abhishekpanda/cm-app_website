  else if (highBp) F('danger', 'High BP (≥140/90): refer to a doctor; check urine albumin.', 'ଉଚ୍ଚ ରକ୍ତଚାପ (≥୧୪୦/୯୦): ଡାକ୍ତରଙ୍କ ପାଖକୁ ପଠାନ୍ତୁ; ପରିସ୍ରାରେ ଆଲ୍‌ବୁମିନ୍ ପରୀକ୍ଷା କରନ୍ତୁ।', 'k28');
  if (highBp && (alb || (a.sx || []).includes('head') || a.oedema === 'gen')) F('danger', 'Signs of pre-eclampsia (high BP with albumin, headache or swelling).', 'ପ୍ରି-ଏକ୍ଲାମ୍ପସିଆର ଲକ୍ଷଣ (ଉଚ୍ଚ ରକ୍ତଚାପ ସହ ଆଲ୍‌ବୁମିନ୍, ମୁଣ୍ଡବିନ୍ଧା ବା ଫୁଲା)।', 'k28');
  if (sys != null && dia != null && sys < 90 && dia < 60) F('warn', 'Low BP: check for bleeding, dehydration or weakness.', 'କମ୍ ରକ୍ତଚାପ: ରକ୍ତସ୍ରାବ, ଜଳାଭାବ ବା ଦୁର୍ବଳତା ଯାଞ୍ଚ କରନ୍ତୁ।');
  const hc = K.anc.hbClass(hb);
  if (hc && hc.k === 'severe') F('danger', `Hb ${hb} g/dl: severe anaemia — high-risk pregnancy; refer for treatment.`, `ହିମୋଗ୍ଲୋବିନ୍ ${hb} g/dl: ଗୁରୁତର ରକ୍ତହୀନତା — ବିପଦସଙ୍କୁଳ ଗର୍ଭ; ଚିକିତ୍ସା ପାଇଁ ପଠାନ୍ତୁ।`, 'k27');
  else if (hc && hc.k !== 'normal') F('warn', `Hb ${hb} g/dl: ${hc.en.toLowerCase()} — take IFA as advised (treatment dose is 2 tablets a day).`, `ହିମୋଗ୍ଲୋବିନ୍ ${hb} g/dl: ${hc.or} — ପରାମର୍ଶ ଅନୁସାରେ ଆଇ.ଏଫ୍.ଏ. ଖାଆନ୍ତୁ (ଚିକିତ୍ସା ମାତ୍ରା ଦିନକୁ ୨ ବଟିକା)।`);
  if (alb && !highBp) F('warn', 'Albumin in urine: recheck BP and urine.', 'ପରିସ୍ରାରେ ଆଲ୍‌ବୁମିନ୍: ରକ୍ତଚାପ ଓ ପରିସ୍ରା ପୁଣି ଯାଞ୍ଚ କରନ୍ତୁ।', 'k29');
  if (a.urineSugar && a.urineSugar !== 'nil') F('warn', 'Sugar in urine: test for diabetes in pregnancy (OGTT).', 'ପରିସ୍ରାରେ ଶର୍କରା: ଗର୍ଭକାଳୀନ ମଧୁମେହ ପାଇଁ OGTT ପରୀକ୍ଷା କରନ୍ତୁ।', 'k29');
  const w = K.num(a.weight);
  if (w != null && w < 40) F('danger', 'Weight below 40 kg: high-risk pregnancy.', 'ଓଜନ ୪୦ କି.ଗ୍ରା.ରୁ କମ୍: ବିପଦସଙ୍କୁଳ ଗର୍ଭ।', 'k26');
  if (w != null && g.days >= 13 * 7) {
    const prev = (p.anc || []).filter(x => x !== a && x.id !== a.id && x.weight != null && K.d.diff(x.date, a.date) >= 21).sort(K.by('date', -1))[0];
    if (prev) { const days = K.d.diff(prev.date, a.date); const rate = (w - prev.weight) / (days / 30.4375);
      if (rate < 0.5) F('warn', `Gaining only ${K.round(rate, 1)} kg a month (less than 0.5 kg): check diet and baby's growth.`, `ମାସକୁ କେବଳ ${K.round(rate, 1)} କି.ଗ୍ରା. ଓଜନ ବଢ଼ୁଛି (୫୦୦ ଗ୍ରାମରୁ କମ୍): ଖାଦ୍ୟ ଓ ଶିଶୁର ବୃଦ୍ଧି ଯାଞ୍ଚ କରନ୍ତୁ।`, 'k211');
      else if (rate > 3) F('warn', `Gaining ${K.round(rate, 1)} kg a month (more than 3 kg): check BP and swelling.`, `ମାସକୁ ${K.round(rate, 1)} କି.ଗ୍ରା. ଓଜନ ବଢ଼ୁଛି (୩ କି.ଗ୍ରା.ରୁ ଅଧିକ): ରକ୍ତଚାପ ଓ ଫୁଲା ଯାଞ୍ଚ କରନ୍ତୁ।`, 'k211'); }
  }
  const pulse = K.num(a.pulse), temp = K.num(a.temp);
  if (pulse != null && pulse > 100) F('warn', 'Pulse above 100: look for anaemia, fever or infection.', 'ନାଡ଼ି ୧୦୦ ରୁ ଅଧିକ: ରକ୍ତହୀନତା, ଜ୍ୱର ବା ସଂକ୍ରମଣ ଯାଞ୍ଚ କରନ୍ତୁ।');
  const tC = temp == null ? null : (temp > 45 ? (temp - 32) * 5 / 9 : temp); // accepts °F too
  if (tC != null && tC >= 38) F('warn', 'Fever: test for malaria (RDT) the same day.', 'ଜ୍ୱର: ସେହି ଦିନ ମ୍ୟାଲେରିଆ (RDT) ପରୀକ୍ଷା କରନ୍ତୁ।', 'k210');
  if (+a.jaundice === 1) F('danger', 'Jaundice: refer to a doctor.', 'ଜଣ୍ଡିସ୍: ଡାକ୍ତରଙ୍କ ପାଖକୁ ପଠାନ୍ତୁ।', 'k212');
  if (+a.pallor === 1 && hb == null) F('warn', 'Pallor: test haemoglobin.', 'ଫିକା ଦେଖାଯାଉଛି: ହିମୋଗ୍ଲୋବିନ୍ ପରୀକ୍ଷା କରନ୍ତୁ।');
  if (a.oedema === 'gen' && !highBp) F('warn', 'Swelling of face or body: check BP and urine.', 'ମୁହଁ ବା ଶରୀର ଫୁଲା: ରକ୍ତଚାପ ଓ ପରିସ୍ରା ଯାଞ୍ଚ କରନ୍ତୁ।');
  const fh = K.num(a.fh);
  if (fh != null && g.days >= 20 * 7 && Math.abs(fh - g.w) > 4) F('warn', `Fundal height ${fh} cm at ${g.w} weeks differs by more than 4 cm: refer for ultrasound.`, `${g.w} ସପ୍ତାହରେ ଗର୍ଭାଶୟର ଉଚ୍ଚତା ${fh} ସେ.ମି. — ୪ ସେ.ମି.ରୁ ଅଧିକ ପାର୍ଥକ୍ୟ: ଅଲଟ୍ରାସାଉଣ୍ଡ ପାଇଁ ପଠାନ୍ତୁ।`, 'k218');
  if ((a.lie === 'breech' || a.lie === 'trans') && g.days >= 36 * 7) F('warn', 'Baby not head-down after 36 weeks: plan delivery at a hospital with caesarean facility (FRU).', '୩୬ ସପ୍ତାହ ପରେ ମଧ୍ୟ ଶିଶୁର ମୁଣ୍ଡ ତଳକୁ ନାହିଁ: ଅସ୍ତ୍ରୋପଚାର ସୁବିଧା ଥିବା ଡାକ୍ତରଖାନାରେ (FRU) ପ୍ରସବ ଯୋଜନା କରନ୍ତୁ।', 'k31');
  if (a.fm === 'reduced' || a.fm === 'absent') F('danger', "Baby's movements reduced or absent: go to hospital today.", 'ଗର୍ଭସ୍ଥ ଶିଶୁର ଚଳପ୍ରଚଳ କମ୍ ବା ନାହିଁ: ଆଜି ହିଁ ଡାକ୍ତରଖାନା ଯାଆନ୍ତୁ।', 'k216');
  const fhr = K.num(a.fhr);
  if (fhr != null && (fhr < 110 || fhr > 160)) F('danger', `Fetal heart ${fhr}/min is outside 110–160: refer urgently.`, `ଗର୍ଭସ୍ଥ ଶିଶୁର ହୃତ୍‌ସ୍ପନ୍ଦନ ${fhr}/ମିନିଟ୍ (୧୧୦–୧୬୦ ବାହାରେ): ତୁରନ୍ତ ପଠାନ୍ତୁ।`);
  (a.sx || []).forEach(k => { const s = K.anc.SX.find(x => x.k === k); if (s) F(s.tone, s.en, s.or, s.hrp); });
  return out;
};

/* window status for the 4 ANCs */
K.anc.schedule = (p, today) => {
  today = today || K.d.today();
  const lmp = K.preg.lmpEq(p); if (!lmp) return [];
  const gaNow = K.preg.ga(p, today).days;
  const visits = (p.anc || []).map(a => ({ a, g: K.preg.ga(p, a.date).days }));
  const bands = [[-999, 14 * 7], [14 * 7, 28 * 7], [28 * 7, 36 * 7], [36 * 7, 999]]; // a visit counts for the band its GA falls in
  return K.anc.WINDOWS.map((w, i) => {
    const done = visits.filter(v => v.g >= bands[i][0] && v.g < bands[i][1]);
    const from = K.d.addDays(lmp, w.from), to = K.d.addDays(lmp, w.to);
    let st;
    if (done.length) st = 'done';
    else if (p.delivery || p.status !== 'active') st = 'na';
    else if (gaNow >= bands[i][1]) st = 'missed';
    else if (gaNow >= w.from) st = gaNow > w.to ? 'overdue' : 'due';
    else st = 'upcoming';
    return { w, from, to, st, visits: done.map(v => v.a).sort(K.by('date')) };
  });
};
K.anc.nextPmsma = (p, today) => {
  today = today || K.d.today();
  const lmp = K.preg.lmpEq(p); if (!lmp) return null;
  let d = K.d.parse(today); d.setDate(9); if (K.d.iso(d) < today) d.setMonth(d.getMonth() + 1);
  for (let i = 0; i < 10; i++) {
    let s = K.d.iso(d); if (K.d.parse(s).getDay() === 0) s = K.d.addDays(s, 1); // Sunday → next working day
    const g = K.preg.ga(p, s).days;
    if (g > 40 * 7) return null;
    if (g >= 13 * 7) return s;
    d.setMonth(d.getMonth() + 1);
  }
  return null;
};

/* ---------------------------------------------------------------- overview section */
K.preg.addSection(10, (c, p) => {
  const sched = K.anc.schedule(p);
  const visits = (p.anc || []).slice().sort(K.by('date', -1));
  const active = K.preg.isActive(p);
  const pm = active ? K.anc.nextPmsma(p) : null;
  const risk = K.preg.risk ? K.preg.risk(p, c) : null;
  const tone = { done: 'ok', due: 'due', overdue: 'over', missed: 'over', upcoming: 'soon', na: 'soon' };
  const lbl = { done: K.t('st.done'), due: K.t('st.due'), overdue: K.t('st.overdue'), missed: K.t('anc.missed'), upcoming: K.t('st.upcoming'), na: '–' };
  const wts = (p.anc || []).filter(a => a.weight != null).sort(K.by('date'));
  return h`<section class="sec">${K.ui.secH(K.t('preg.sec.anc'), active ? K.ui.btn(K.t('btn.add'), { href: K.preg.url(c, p, '/anc/new'), tone: 'ghost', size: 'sm', icon: 'plus' }) : '')}
    <div class="list">${sched.map(s => K.ui.li({ icon: s.st === 'done' ? 'check' : 'calendar', tone: s.st === 'done' ? 'done' : s.st === 'due' ? 'amber' : (s.st === 'overdue' || s.st === 'missed') ? 'red' : 'ink',
      title: K.t(s.w.key), meta: s.visits.length ? s.visits.map(v => K.d.fmt(v.date)).join(', ') : `${K.d.fmt(s.from, 'dm')} – ${K.d.fmt(s.to)}`, trail: K.ui.pill(lbl[s.st], tone[s.st]) }))}
      ${pm ? K.ui.li({ icon: 'hospital', tone: 'info', title: K.t('anc.pmsma'), meta: `${K.d.weekday(pm)}, ${K.d.fmt(pm, 'long')} · ${risk && risk.high ? K.t('anc.pmsmaHrp') : K.t('anc.pmsmaSub')}`, trail: K.ui.pill(K.d.rel(pm), 'info') }) : ''}
    </div>
    <p class="small faint" style="margin-top:6px">${K.t('anc.min4')}</p>
    ${visits.length ? h`<h3 style="margin:14px 0 8px">${K.t('anc.visits')}</h3><div class="list">${visits.map(a => {
      const g = K.preg.ga(p, a.date); const fl = K.anc.flags(a, p, c);
      const vals = [a.weight != null ? `${K.n(a.weight)} ${K.t('u.kg')}` : '', a.bpSys ? `BP ${K.digits(a.bpSys + '/' + (a.bpDia || '–'))}` : '', a.hb != null ? `Hb ${K.n(a.hb)}` : ''].filter(Boolean).join(' · ');
      return K.ui.li({ href: K.preg.url(c, p, '/anc/' + a.id), icon: fl.some(f => f.tone === 'danger') ? 'alert' : fl.length ? 'info' : 'check', tone: fl.some(f => f.tone === 'danger') ? 'red' : fl.length ? 'amber' : 'done',
        title: `${K.d.fmt(a.date)} · ${K.preg.gaShort(g)}`, meta: vals || K.t('anc.none'), trail: fl.length ? K.ui.pill(K.digits(fl.length), fl.some(f => f.tone === 'danger') ? 'over' : 'due', 'alert') : '' });
    })}</div>` : h`<p class="small">${K.t('anc.none')}</p>`}
    ${wts.length >= 2 ? K.anc.weightChart(p, wts) : ''}
  </section>`;
});

/* tiny weight-by-week chart with the 1 kg/month guide line from the first weight */
K.anc.weightChart = (p, wts) => {
  const pts = wts.map(a => ({ x: K.preg.ga(p, a.date).days / 7, y: +a.weight }));
  const x0 = 0, x1 = 42, ys = pts.map(q => q.y);
  const y0 = Math.floor(Math.min(...ys) - 2), y1 = Math.ceil(Math.max(...ys, pts[0].y + 10) + 1);
  const W = 320, H = 150, L = 34, B = 22, T = 8, R = 8;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const first = pts[0]; // guide: flat to 12 weeks, then about 1 kg a month (MCP card)
  const g12 = Math.max(first.x, 12);
  const guide = [[first.x, first.y], [g12, first.y], [40, first.y + (40 - g12) / 4.345]];
  const gx = [0, 12, 28, 40], gy = []; for (let v = Math.ceil(y0 / 5) * 5; v <= y1; v += 5) gy.push(v);
  const gain = pts[pts.length - 1].y - pts[0].y;
  return h`<div class="k-card" style="margin-top:12px"><div class="eyebrow">${K.t('anc.wtTrend')}</div>
    <svg class="mini-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${K.t('anc.wtTrend')}">
      ${gy.map(v => h`<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="g"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" class="t">${K.digits(v)}</text>`)}
      ${gx.map(v => h`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}" class="g"/><text x="${X(v)}" y="${H - 6}" text-anchor="middle" class="t">${K.digits(v)}</text>`)}
      <polyline points="${guide.map(q => `${X(q[0]).toFixed(1)},${Y(q[1]).toFixed(1)}`).join(' ')}" class="guide"/>
      <polyline points="${pts.map(q => `${X(q.x).toFixed(1)},${Y(q.y).toFixed(1)}`).join(' ')}" class="line"/>
      ${pts.map(q => h`<circle cx="${X(q.x).toFixed(1)}" cy="${Y(q.y).toFixed(1)}" r="3.6" class="dot"/>`)}
    </svg>
    <p class="small" style="margin:6px 0 0">${K.t('anc.wtGain', { kg: K.n(gain), d: K.d.fmt(wts[0].date) })}. ${K.t('anc.wtAdvice')}</p></div>`;
};

/* ---------------------------------------------------------------- visit form */

  const us = ['nil', '1', '2', '3'].map(v => ({ v, l: v === 'nil' ? K.t('u.nil') : '+'.repeat(+v) }));

  const hw = h`<div class="frow">${F('pulse', K.t('anc.pulse'), { type: 'number', unit: '/min' })}${F('temp', K.t('anc.temp'), { type: 'decimal', unit: '°C' })}</div>
      ${K.ui.yn({ name: 'pallor', q: K.t('anc.pallor'), value: a.pallor, live: 'ancPreview' })}

      ${ch('oedema', K.t('anc.oedema'), ['none', 'feet', 'gen'].map(v => ({ v, l: K.t('oed.' + v) })))}
      <div class="frow">${F('fh', K.t('anc.fh'), { type: 'decimal', unit: K.t('u.cm') })}${F('fhr', K.t('anc.fhr'), { type: 'number', unit: '/min' })}</div>
      ${ch('lie', K.t('anc.lie'), ['ceph', 'breech', 'trans', 'np'].map(v => ({ v, l: K.t('lie.' + v) })))}

      ${ch('by', K.t('anc.by'), ['anm', 'doc', 'asha', 'self'].map(v => ({ v, l: K.t('by.' + v) })))}
    </div>
    <fieldset class="fgroup"><legend>${K.t('anc.measure')}</legend>
      ${F('weight', K.t('anc.weight'), { type: 'decimal', unit: K.t('u.kg') })}
      <div class="field"><span class="lbl">${K.t('anc.bp')}</span><div class="frow">${F('bpSys', K.t('anc.sys'), { type: 'number', unit: 'mmHg' })}${F('bpDia', K.t('anc.dia'), { type: 'number', unit: 'mmHg' })}</div></div>
      ${F('hb', K.t('anc.hb'), { type: 'decimal', unit: 'g/dl' })}
      ${ch('urineAlb', K.t('anc.urineAlb'), ua)}
      ${ch('urineSugar', K.t('anc.urineSugar'), us)}
    </fieldset>
    <fieldset class="fgroup"><legend>${K.t('anc.sx')}</legend>
      <div class="choices">${K.anc.SX.map(s => h`<label class="choice ${s.tone === 'danger' ? 'danger' : 'warn'}"><input type="checkbox" name="sx" value="${s.k}" ${(a.sx || []).includes(s.k) ? K.raw('checked') : ''} data-live="ancPreview"><span>${K.L(s)}</span></label>`)}</div>
    </fieldset>
    <fieldset class="fgroup"><legend>${K.t('anc.given')}</legend>
      ${ch('tdDose', K.t('anc.td'), tdOpts, a.tdDose || '')}
      <div class="frow">${F('ifaGiven', K.t('anc.ifa'), { type: 'number', unit: K.t('anc.tabs') })}${F('caGiven', K.t('anc.ca'), { type: 'number', unit: K.t('anc.tabs') })}</div>
      ${K.ui.sw({ name: 'albGiven', checked: !!a.albGiven, title: K.t('anc.alb') })}
    </fieldset>
    ${hcp ? h`<fieldset class="fgroup"><legend>${K.t('anc.hw')}</legend>${hw}</fieldset>`
      : h`<details class="acc"><summary>${K.ui.icon('users', 'sm')}${K.t('anc.showMore')}</summary><div class="acc-b form">${hw}</div></details>`}

K.forms.ancSave = async (v, f) => {
  const c = K.card.load(f.dataset.id); const p = c && K.card.findPreg(c, f.dataset.pid); if (!p) return;
  if (!v.date || !K.d.valid(v.date)) { K.ui.toast(K.t('err.date')); return; }
  if (K.d.diff(v.date, K.d.today()) < 0) { K.ui.toast(K.t('err.future')); return; }
  const lmp = K.preg.lmpEq(p); if (lmp && (K.d.diff(lmp, v.date) < 0 || (p.delivery && K.d.diff(p.delivery.date, v.date) > 0))) { K.ui.toast(K.t('anc.dateOut'), 3500); return; }
  let a = f.dataset.aid ? (p.anc || []).find(x => x.id === f.dataset.aid) : null;
  if (!a) { a = { id: K.uid('a') }; (p.anc = p.anc || []).push(a); }
  const keys = ['date', 'place', 'by', 'weight', 'bpSys', 'bpDia', 'hb', 'urineAlb', 'urineSugar', 'pulse', 'temp', 'pallor', 'jaundice', 'oedema', 'fh', 'fhr', 'lie', 'fm', 'pv', 'tdDose', 'ifaGiven', 'caGiven', 'next', 'notes'];
  keys.forEach(k => { if (v[k] == null || v[k] === '') delete a[k]; else a[k] = (k === 'pallor' || k === 'jaundice') ? +v[k] : v[k]; });

  p.td = p.td || {};

  if (a.ifaGiven) { p.ifa = p.ifa || { days: {} }; p.ifa.issued = (p.ifa.issued || []).filter(x => x.visit !== a.id); p.ifa.issued.push({ date: a.date, n: a.ifaGiven, visit: a.id }); if (!p.ifa.start) p.ifa.start = a.date; }
  if (a.caGiven) { p.calcium = p.calcium || { days: {} }; p.calcium.issued = (p.calcium.issued || []).filter(x => x.visit !== a.id); p.calcium.issued.push({ date: a.date, n: a.caGiven, visit: a.id }); if (!p.calcium.start) p.calcium.start = a.date; }

};
K.acts.ancDelete = async (el) => {

};

K.due.add((c, today) => {
  const p = K.card.activePreg(c); if (!p || !K.preg.edd(p)) return [];
  const out = []; const g = K.preg.ga(p, today); const url = K.preg.url(c, p);
  const sched = K.anc.schedule(p, today);
  const next = sched.find(s => s.st === 'due' || s.st === 'overdue' || s.st === 'upcoming');
  if (next) out.push({ id: 'anc' + next.w.n, kind: 'anc', icon: 'calendar', href: url + '/anc/new', who: c.mother.name,
    title: { en: `ANC ${next.w.n} check-up`, or: `${['', '୧ମ', '୨ୟ', '୩ୟ', '୪ର୍ଥ'][next.w.n]} ସ୍ୱାସ୍ଥ୍ୟ ପରୀକ୍ଷା (ଏଏନ୍‌ସି)` },
    date: next.st === 'upcoming' ? next.from : (next.st === 'overdue' ? next.to : today), status: next.st === 'overdue' ? 'overdue' : undefined });
  const pm = K.anc.nextPmsma(p, today);
  if (pm && K.d.diff(today, pm) <= 31) out.push({ id: 'pmsma', kind: 'anc', icon: 'hospital', href: url, title: { en: 'PMSMA doctor check-up (9th)', or: 'PMSMA ଡାକ୍ତରୀ ପରୀକ୍ଷା (୯ ତାରିଖ)' }, date: pm });
  const e = K.preg.edd(p);
  if (g && g.days > 287) out.push({ id: 'postdate', kind: 'danger', icon: 'alert', href: url, title: { en: 'Past the expected date by more than 7 days — see a doctor today', or: 'ସମ୍ଭାବ୍ୟ ପ୍ରସବ ତାରିଖରୁ ୭ ଦିନରୁ ଅଧିକ ବିତିଗଲାଣି — ଆଜି ଡାକ୍ତରଙ୍କୁ ଦେଖାନ୍ତୁ' }, date: K.d.addDays(e, 7), status: 'overdue' });
  return out;
});
K.summary.add((c) => {

/* effective value of one item: manual override wins over records */
K.hrp.value = (it, p, c) => {
  const m = p.hrp ? p.hrp[it.code] : undefined;
  let a = null; try { a = it.auto ? it.auto(p, c) : null; } catch (e) { a = null; }
  const av = a && typeof a === 'object' ? a.v : a; const date = a && typeof a === 'object' ? a.date : null;
  if (m === 0 || m === 1) return { v: m, src: 'manual', auto: av, date };
  return { v: av, src: av == null ? null : 'auto', auto: av, date };
};
K.preg.risk = (p, c) => {
  if (!p) return null;
  const reasons = K.hrp.ITEMS.map(it => ({ it, r: K.hrp.value(it, p, c) })).filter(x => x.r.v === 1);
  return { high: reasons.length > 0, reasons, hard: p.village === 'seasonal' || p.village === 'always' };
};

/* ---------------------------------------------------------------- screen */
K.route('/card/:id/preg/:pid/hrp', ({ id, pid }) => {
  const c = K.card.load(id); if (!c) return K.screens.notFound(); const p = K.card.findPreg(c, pid); if (!p) return K.screens.notFound();
  const risk = K.preg.risk(p, c); const rc = p.redCard || {};
  const row = (it) => { const r = K.hrp.value(it, p, c);
    return K.ui.yn({ name: it.code, code: it.tag, q: K.L(it), value: r.v == null ? '' : r.v, auto: r.src === 'auto',
      sub: r.src === 'auto' ? `${K.t('hrp.auto')}${r.date ? ' · ' + K.d.fmt(r.date) : ''}` : (r.src === 'manual' && r.auto != null && r.auto !== r.v ? `${K.t('hrp.auto')}: ${r.auto ? K.t('yes') : K.t('no')}` : '') }); };
  const group = (sec) => h`<fieldset class="fgroup"><legend>${K.t('hrp.sec.' + sec)}</legend><div>${K.hrp.ITEMS.filter(i => i.sec === sec).map(row)}</div></fieldset>`;
  const perAnc = K.anc.schedule(p).map(s => { const hit = s.visits.some(a => K.anc.flags(a, p, c).some(f => f.hrp)) || (s.visits.length && risk.reasons.some(x => x.it.sec !== 'anc'));
    return { n: s.w.n, v: s.visits.length ? (hit ? 1 : 0) : null, d: s.visits[0] && s.visits[0].date }; });
  return {
    title: K.t('hrp.title'), sub: c.mother.name, back: K.preg.url(c, p).slice(1), tab: 'home',
    html: h`<div class="wrap">${K.ui.phead(K.t('preg.overview'), K.t('hrp.title'), K.t('hrp.lede'))}
      ${risk.high ? K.ui.callout('danger', K.t('hrp.isHigh'), h`<p>${K.t('hrp.because')}</p><ul>${risk.reasons.map(x => h`<li>${K.L(x.it)}</li>`)}</ul>`)
        : K.ui.callout('', K.t('hrp.notHigh'), K.t('hrp.recheck'), 'shield')}
      ${risk.hard ? h`<p></p>${K.ui.callout('warn', K.t('hrp.hard'), K.t('hrp.hardDo'), 'pin')}` : ''}
      ${risk.high ? h`<section class="sec" style="margin-top:14px">${K.ui.eyebrow(K.t('hrp.what'))}<ul class="ul">${['hrp.do1', 'hrp.do2', 'hrp.do3', 'hrp.do4'].map(k => h`<li>${K.t(k)}</li>`)}</ul></section>` : h`<p></p>`}
      <form class="form" data-form="hrpSave" data-id="${id}" data-pid="${pid}">
        ${risk.high || rc.no ? h`<fieldset class="fgroup"><legend>${K.t('hrp.redCard')}</legend><div class="frow">
          ${K.ui.field({ name: 'redNo', label: K.t('hrp.redNo'), value: rc.no, cls: 'mono' })}${K.ui.field({ name: 'redDate', type: 'date', label: K.t('hrp.redDate'), value: rc.date, max: K.d.today() })}</div>
          ${K.ui.field({ name: 'referral', label: K.t('hrp.referral'), value: rc.referral })}</fieldset>` : ''}
        ${group('past')}${group('now')}${group('anc')}${group('nat')}
        ${K.settings.isHcp() ? h`<div class="k-card"><div class="eyebrow">${K.t('hrp.perAnc')}</div><div class="grid2">${perAnc.map(x => K.ui.stat(K.t('anc.n', { n: x.n }), x.v == null ? '–' : x.v ? K.t('st.high') : K.t('no'), x.v ? 'danger' : 'ink', x.d ? K.d.fmt(x.d) : ''))}</div></div>` : ''}
        <div class="btn-bar">${K.ui.btn(K.t('hrp.save'), { type: 'submit', icon: 'check' })}</div>
      </form></div>`,
  };
});
K.forms.hrpSave = async (v, f) => {
  const c = K.card.load(f.dataset.id); const p = c && K.card.findPreg(c, f.dataset.pid); if (!p) return;
  p.hrp = {};
  K.hrp.ITEMS.forEach(it => {
    if (v[it.code] == null || v[it.code] === '') return;
    const val = +v[it.code]; const r = K.hrp.value(it, Object.assign({}, p, { hrp: {} }), c);
    if (r.auto !== val) p.hrp[it.code] = val; // only store real overrides
  });
  if (v.redNo || v.redDate || v.referral) p.redCard = { no: v.redNo || '', date: v.redDate || '', referral: v.referral || '' };
  await K.store.save(c); K.ui.toast(K.t('saved')); K.go(K.preg.url(c, p).slice(1));
};

/* overview section: risk banner + link (order 5 → shows first) */
K.preg.addSection(5, (c, p) => {
  if (p.status === 'ended') return '';
  const r = K.preg.risk(p, c);
  return h`<section class="sec">${r.high
    ? h`<a class="k-card danger hrp-banner" href="${K.preg.url(c, p, '/hrp')}"><span class="pills">${K.ui.pill(K.t('hrp.isHigh'), 'solid-red', 'alert')}${p.redCard && p.redCard.no ? K.ui.pill(K.t('hrp.redCard') + ' ' + p.redCard.no, 'red') : ''}</span>
        <span class="small" style="display:block;margin-top:8px">${r.reasons.slice(0, 4).map(x => K.L(x.it)).join(' · ')}${r.reasons.length > 4 ? ' …' : ''}</span></a>`
    : h`<div class="list">${K.ui.li({ href: K.preg.url(c, p, '/hrp'), icon: 'shield', title: K.t('hrp.title'), meta: K.t('hrp.notHigh') })}</div>`}
    ${r.hard ? h`<p></p>${K.ui.callout('warn', K.t('hrp.hard'), K.t('hrp.hardDo'), 'pin')}` : ''}</section>`;
});

}

/* ---------------------------------------------------------------- Td logic */
K.td = {
  status(p, today) {
    today = today || K.d.today(); const td = p.td || {};
    if (td.boosterOnly) return { done: !!td.booster, next: td.booster ? null : { k: 'booster', date: K.d.max(p.createdAt.slice(0, 10), K.preg.lmpEq(p) || today) } };
    if (!td.td1) return { done: false, next: { k: 'td1', date: K.d.max(p.createdAt.slice(0, 10), K.preg.lmpEq(p) || today) } };
    if (!td.td2) return { done: false, next: { k: 'td2', date: K.d.addDays(td.td1, 28) } };
    return { done: true, next: null };
  },
};

/* ---------------------------------------------------------------- tracker component (shared with postpartum) */
K.tracker = {
  /* t = { days:{iso:1}, start }, total days, from date (first allowed day) */
  render(id, label, t, total, from, opts = {}) {
    const today = K.d.today(); t = t || { days: {} };
    const start = t.start && K.d.cmp(t.start, from) < 0 ? t.start : from;
    const end = K.d.addDays(start, total - 1);
    const n = Object.keys(t.days || {}).filter(d => t.days[d]).length;
    const taken = !!(t.days || {})[today];
    const cells = []; let cur = start; let lastMonth = -1;
    // pad to Monday
    const dow = (K.d.parse(start).getDay() + 6) % 7; for (let i = 0; i < dow; i++) cells.push(h`<span class="tk-pad"></span>`);
    for (let i = 0; i < total; i++) {
      const dt = K.d.parse(cur); const fut = K.d.cmp(cur, today) > 0;
      if (dt.getMonth() !== lastMonth && i > 0 && dt.getDate() === 1) { /* month boundary marker via class */ }
      cells.push(h`<button type="button" class="tk ${t.days && t.days[cur] ? 'on' : ''} ${cur === today ? 'td' : ''} ${dt.getDate() === 1 ? 'm1' : ''}" ${fut ? K.raw('disabled') : ''}
        data-act="tick" data-arg="${opts.key}|${cur}" aria-pressed="${!!(t.days && t.days[cur])}" title="${K.d.fmt(cur)}">${K.digits(dt.getDate())}</button>`);
      lastMonth = dt.getMonth(); cur = K.d.addDays(cur, 1);
    }
    const issued = K.sum((t.issued || []).map(x => x.n));
    return h`<section class="k-card trk" id="${id}">
      <div class="trk-h"><div><h3>${label}</h3><p class="small" style="margin:2px 0 0">${opts.rule || ''}</p></div></div>
      <div class="trk-top">
        <button type="button" class="trk-today ${taken ? 'on' : ''}" data-act="tick" data-arg="${opts.key}|${today}" aria-pressed="${taken}" ${K.d.cmp(today, start) < 0 ? K.raw('disabled') : ''}>
          ${K.ui.icon(taken ? 'check' : 'pill', 'lg')}<span>${taken ? K.t('trk.today') : K.t('trk.notToday')}</span></button>
        <div class="trk-n"><b class="mono">${K.digits(n)}</b><span class="small">${K.t('trk.count', { n, t: total })}</span>${K.ui.bar(n / total * 100)}
          <span class="small faint">${K.d.cmp(today, start) < 0 ? K.t('trk.startOn', { d: K.d.fmt(start) }) : K.t('trk.start', { d: K.d.fmt(start) })}${issued ? ' · ' + K.t('trk.issued', { n: issued }) : ''}</span></div>
      </div>
      <details class="trk-more"><summary>${K.t('trk.grid')}</summary>
        <div class="tk-wd">${[1, 2, 3, 4, 5, 6, 0].map(i => h`<span>${K.d.WD[K.i18n.lang === 'or' ? 'or' : 'en'][i].slice(0, K.i18n.lang === 'or' ? 2 : 1)}</span>`)}</div>
        <div class="tk-grid">${cells}</div>
        <p class="small faint" style="margin:8px 0 0">${K.d.fmt(start)} → ${K.d.fmt(end)}</p></details>
    </section>`;
  },
};
/* data-arg = "<cardId>:<pregId|childId>:<path>|<date>" ; path like ifa / calcium / ppIfa */
K.acts.tick = async (el) => {
  const [key, date] = el.dataset.arg.split('|'); const [cid, oid, path] = key.split(':');
  const c = K.card.load(cid); if (!c) return;
  const o = K.card.findPreg(c, oid) || K.card.findKid(c, oid); if (!o) return;
  const t = o[path] = o[path] || { days: {} }; t.days = t.days || {};
  if (t.days[date]) delete t.days[date]; else { t.days[date] = 1; if (!t.start || K.d.cmp(date, t.start) < 0) t.start = date; }
  await K.store.save(c, true);
  K.refresh();
};

        ${d.babies.map((b, i) => h`<dt>${K.t('del.baby', { n: i + 1 })}</dt><dd>${K.t('out.' + b.outcome)}${b.sex ? ' · ' + K.t('sex.' + b.sex) : ''}${b.wt != null ? ' · ' + K.n(b.wt, 2) + ' ' + K.t('u.kg') : ''}</dd>`)}
      </dl><p style="margin:10px 0 0">${K.ui.btn(K.t('del.edit'), { href: K.preg.url(c, p, '/delivery'), tone: 'quiet', size: 'sm', icon: 'edit' })}</p></div>
      ${kids.length ? h`<div class="cards-list" style="margin-top:10px">${kids.map(k => K.child.summaryCard(c, k))}</div>` : ''}
      <section class="sec" style="margin-top:18px">${K.ui.secH(K.t('pnc.visits'))}
        <p class="small">${K.t('pnc.rule')}</p>${base !== d.date ? h`<p class="small">${K.t('pnc.sncuNote', { d: K.d.fmt(base) })}</p>` : ''}
        <div class="list">${sch.map(s => K.ui.li({ href: K.preg.url(c, p, '/pnc/' + s.n), icon: s.st === 'done' ? 'check' : 'house', tone: s.st === 'done' ? 'done' : s.st === 'due' ? 'amber' : s.st === 'overdue' ? 'red' : 'ink',
          title: K.t('pnc.day', { n: s.n }), meta: s.v ? K.d.fmt(s.v.date) : K.d.fmt(s.date), trail: K.ui.pill(lbl[s.st], tone[s.st]) }))}</div></section>
      <section class="sec">${K.ui.secH(K.t('pnc.ppTabs'))}<p class="small">${K.t('pnc.ppRule')}</p>
        ${K.tracker.render('trk-ppifa', K.t('ifa.title'), p.ppIfa, 180, d.date, { key: `${id}:${pid}:ppIfa` })}<p></p>
        ${K.tracker.render('trk-ppca', K.t('ca.title'), p.ppCalcium, 180, d.date, { key: `${id}:${pid}:ppCalcium` })}</section>
      ${K.fp ? K.fp.section(c, p) : ''}
      <section class="sec">${K.ui.callout('danger', K.L(K.content.danger.post.title), h`<ul>${K.content.danger.post.items.slice(0, 6).map(x => h`<li>${K.L(x)}</li>`)}</ul><p style="margin-top:8px"><a href="#/learn/danger/post">${K.t('see.all')}</a></p>`)}</section>
    </div>`,
  };
});

/* ---------------------------------------------------------------- PNC / HBNC visit form */
K.route('/card/:id/preg/:pid/pnc/:day', ({ id, pid, day }) => {
  const c = K.card.load(id); if (!c) return K.screens.notFound(); const p = K.card.findPreg(c, pid); if (!p || !p.delivery) return K.screens.notFound();
  const n = +day; const s = K.pnc.schedule(p, c).find(x => x.n === n) || { date: K.d.today() };
  const m = (p.pnc || []).find(x => x.day === n) || {};
  const kids = c.children.filter(k => k.pregId === p.id);
  const POS = ['pm.toilet', 'pm.bf', 'pm.diet', 'pm.rest', 'pm.fp', 'pb.ebf', 'pb.suck', 'pb.active', 'pb.urine', 'pb.stool', 'pb.kmc'];
  const yn = (name, key, val, live) => K.ui.yn({ name, q: K.t(key), value: val, live: live || 'pncPreview', pos: POS.includes(key) });
  const babyFs = (k) => { const b = (k.hbnc || []).find(x => x.day === n) || {}; const pre = `k_${k.id}_`;
    return h`<fieldset class="fgroup"><legend>${K.t('pnc.baby')} · ${K.child.label(k)}</legend>
      <div class="frow">${K.ui.field({ name: pre + 'weight', type: 'decimal', label: K.t('pb.weight'), unit: K.t('u.kg'), value: b.weight, attrs: { 'data-live': 'pncPreview' } })}${K.ui.field({ name: pre + 'temp', type: 'decimal', label: K.t('pb.temp'), unit: '°C', value: b.temp, attrs: { 'data-live': 'pncPreview' } })}</div>
      ${K.ui.field({ name: pre + 'breaths', type: 'number', label: K.t('pb.breaths'), unit: '/min', value: b.breaths, hint: h`<a href="#/tools/breath">${K.t('tool.breath')}</a>`, attrs: { 'data-live': 'pncPreview' } })}
      ${['ebf', 'suck', 'active', 'urine', 'stool', 'kmc'].map(x => yn(pre + x, 'pb.' + x, b[x]))}
      ${['diarrhoea', 'vomit', 'fits', 'indrawing', 'jaundice', 'pustules', 'eyes'].map(x => yn(pre + x, 'pb.' + x, b[x]))}
      ${K.ui.choices({ name: pre + 'cord', label: K.t('pb.cord'), value: b.cord, options: [{ v: 'dry', l: K.t('cord.dry') }, { v: 'red', l: K.t('cord.red'), tone: 'danger' }], live: 'pncPreview' })}
    </fieldset>`; };
  return {
    title: K.t('pnc.visit', { n }), sub: c.mother.name, back: K.preg.url(c, p, '/pnc').slice(1), tab: 'home',
    html: h`<div class="wrap">${K.ui.phead(K.t('pnc.title'), K.t('pnc.visit', { n }))}
      <form class="form" data-form="pncSave" data-id="${id}" data-pid="${pid}" data-day="${n}" novalidate>
        <div class="fgroup">${K.ui.field({ name: 'date', type: 'date', label: K.t('date'), value: m.date || (K.d.cmp(s.date, K.d.today()) <= 0 ? s.date : K.d.today()), max: K.d.today(), required: true })}
          ${K.ui.choices({ name: 'by', label: K.t('anc.by'), value: m.by || (K.settings.isHcp() ? 'asha' : ''), options: ['asha', 'anm', 'doc', 'self'].map(v => ({ v, l: K.t('by.' + v) })) })}</div>
        <fieldset class="fgroup"><legend>${K.t('pnc.mother')}</legend>
          <div class="frow">${K.ui.field({ name: 'bpSys', type: 'number', label: K.t('anc.sys'), unit: 'mmHg', value: m.bpSys, attrs: { 'data-live': 'pncPreview' } })}${K.ui.field({ name: 'bpDia', type: 'number', label: K.t('anc.dia'), unit: 'mmHg', value: m.bpDia, attrs: { 'data-live': 'pncPreview' } })}</div>
          ${K.ui.field({ name: 'temp', type: 'decimal', label: K.t('anc.temp'), unit: '°C', value: m.temp, attrs: { 'data-live': 'pncPreview' } })}
          ${K.ui.choices({ name: 'breast', label: K.t('pm.breast'), value: m.breast, options: ['normal', 'engorged', 'cracked'].map(v => ({ v, l: K.t('br.' + v), tone: v === 'normal' ? '' : 'warn' })), live: 'pncPreview' })}
          ${['pallor', 'bleed', 'uterus', 'discharge', 'episio', 'pain', 'fits', 'headache', 'mood'].map(k => yn(k, 'pm.' + k, m[k]))}
          ${['toilet', 'bf', 'diet', 'rest', 'fp'].map(k => yn(k, 'pm.' + k, m[k]))}
          ${K.ui.field({ name: 'other', label: K.t('pm.other'), value: m.other })}
        </fieldset>
        ${kids.map(babyFs)}
        <section id="pnc-preview" aria-live="polite"></section>
        <div class="btn-bar">${K.ui.btn(K.t('pnc.save'), { type: 'submit', icon: 'check' })}</div>
      </form></div>`,
    mount() { K.live.pncPreview(); },
  };
});
const pncCollect = (v, f, c, p) => {
  const n = +f.dataset.day; const m = { day: n, date: v.date, by: v.by || '' };
  ['bpSys', 'bpDia', 'temp', 'breast', 'other'].forEach(k => { if (v[k] != null) m[k] = v[k]; });
  ['pallor', 'bleed', 'uterus', 'discharge', 'episio', 'pain', 'fits', 'headache', 'mood', 'toilet', 'bf', 'diet', 'rest', 'fp'].forEach(k => { if (v[k] != null) m[k] = +v[k]; });
  const babies = c.children.filter(k => k.pregId === p.id).map(k => { const pre = `k_${k.id}_`; const b = { day: n, date: v.date };
    Object.keys(v).filter(x => x.startsWith(pre)).forEach(x => { const key = x.slice(pre.length); const val = v[x]; b[key] = ['weight', 'temp', 'breaths', 'cord'].includes(key) ? val : +val; });
    return { k, b }; });
  return { m, babies, n };
};
K.live.pncPreview = K.debounce(() => {
  const f = K.$('form[data-form="pncSave"]'); if (!f) return; const c = K.card.load(f.dataset.id); const p = c && K.card.findPreg(c, f.dataset.pid); if (!p) return;
  const { m, babies, n } = pncCollect(K.formData(f), f, c, p);
  const fl = K.pnc.motherFlags(m).concat(...babies.map(({ k, b }) => K.pnc.babyFlags(b, k, n).map(x => Object.assign({}, x, { en: `${K.child.label(k)}: ${x.en}`, or: `${K.child.label(k)}: ${x.or}` }))));
  K.$('#pnc-preview').innerHTML = K.hv(h`<h3 style="margin:4px 0 8px">${K.t('pnc.result')}</h3>${K.pnc.flagList(fl)}`);
}, 300);
K.forms.pncSave = async (v, f) => {
  const c = K.card.load(f.dataset.id); const p = c && K.card.findPreg(c, f.dataset.pid); if (!p) return;
  if (!v.date || !K.d.valid(v.date) || K.d.diff(v.date, K.d.today()) < 0) { K.ui.toast(K.t('err.date')); return; }
  const { m, babies, n } = pncCollect(v, f, c, p);
  p.pnc = (p.pnc || []).filter(x => x.day !== n).concat([m]).sort(K.by('day'));
  babies.forEach(({ k, b }) => { k.hbnc = (k.hbnc || []).filter(x => x.day !== n).concat([b]).sort(K.by('day'));
    if (b.weight != null) { k.growth = k.growth || []; const g = k.growth.find(x => x.src === 'hbnc' && x.day === n); if (g) Object.assign(g, { date: b.date, wt: b.weight }); else k.growth.push({ id: K.uid('g'), date: b.date, wt: b.weight, src: 'hbnc', day: n }); } });
  if (m.fp === 1) { p.fp = p.fp || {}; p.fp.counselled = p.fp.counselled || m.date; }
  await K.store.save(c); K.ui.toast(K.t('saved')); K.go(K.preg.url(c, p, '/pnc').slice(1));
};

/* ---------------------------------------------------------------- pregnancy overview: delivery section */
K.preg.addSection(60, (c, p) => {
  if (p.status === 'ended') return '';
  if (p.delivery) return h`<section class="sec">${K.ui.secH(K.t('preg.sec.delivery'))}<div class="list">${K.ui.li({ href: K.preg.url(c, p, '/pnc'), icon: 'baby', tone: 'done', title: K.t('preg.deliveredOn', { d: K.d.fmt(p.delivery.date) }), meta: `${K.t('del.place.' + p.delivery.place)} · ${K.t('dt.' + p.delivery.type)}` })}</div></section>`;
  const g = K.preg.ga(p);
  return h`<section class="sec">${K.ui.secH(K.t('preg.sec.delivery'))}${K.ui.btn(K.t('preg.recordDelivery'), { href: K.preg.url(c, p, '/delivery'), tone: g && g.days >= 28 * 7 ? 'primary' : 'ghost', icon: 'baby', block: true })}</section>`;
});

/* dashboard: delivered pregnancies within 42 days show the PNC card */
K.due.add((c, today) => {
  const out = [];
  (c.pregnancies || []).filter(p => p.delivery && K.d.diff(p.delivery.date, today) <= 45).forEach(p => {
    const nx = K.pnc.schedule(p, c, today).find(s => s.st !== 'done');
    if (nx) out.push({ id: 'pnc' + nx.n, kind: 'pnc', icon: 'house', href: K.preg.url(c, p, '/pnc/' + nx.n), title: { en: `Home visit after delivery · day ${nx.n}`, or: `ପ୍ରସବ ପରେ ଗୃହ ପରିଦର୍ଶନ · ${nx.n} ଦିନ` }, date: nx.date, status: nx.st === 'overdue' ? 'overdue' : undefined });
  });
  return out;
});
K.summary.add((c) => (c.pregnancies || []).filter(p => p.delivery && K.d.diff(p.delivery.date, K.d.today()) <= 60).map(p => `${K.t('preg.deliveredOn', { d: K.d.fmt(p.delivery.date) })} · ${K.t('del.place.' + p.delivery.place)} · ${K.t('dt.' + p.delivery.type)}`));

}

    let r;
    if (it.sex && k.sex && it.sex !== k.sex) r = { st: 'na', why: 'sex' };
    else if (it.je && !ctx.je && !rec.date) r = { st: 'na', why: 'je' };
    else if (rec.date) r = { st: 'given', date: rec.date };
    else {
      let due = K.vax.at(k.dob, it.due); let after = null;
      if (it.prev) { const pg = gv(k, it.prev); if (pg) due = K.d.max(due, K.d.addDays(pg, it.gap || 28)); else after = it.prev; }
      const lim = it.upto ? K.vax.at(k.dob, it.upto) : null;
      const startLim = it.start && !it.prev ? K.vax.at(k.dob, it.start) : null;
      const prevSt = it.prev ? out[it.prev] : null;
      if (startLim && K.d.cmp(today, startLim) > 0) r = { st: 'missed', due, why: 'start', alt: it.alt };
      else if (lim && K.d.cmp(today, lim) > 0) r = { st: 'missed', due, why: 'upto' };
      else if (after && prevSt && (prevSt.st === 'missed' || prevSt.st === 'na')) r = { st: prevSt.st, due, why: 'prev' };
      else if (after) r = { st: 'waiting', due, after, lim };
      else { const lag = K.d.diff(due, today); r = { st: lag < 0 ? 'upcoming' : lag <= 28 ? 'due' : 'overdue', due, lim }; }
      if (rec.missed) r.missedRec = rec.missed;
    }
    out[it.id] = Object.assign({ it }, r);
  });
  return out;
};
K.vax.vitaState = (k, today) => {
  today = today || K.d.today(); if (!k.dob) return [];
  return K.vax.VITA.map((v, i) => {
    const date = (k.vitA || {})[v.n]; const alb = (k.alb || {})[v.n];
    const due = K.d.addMonths(k.dob, v.m); const next = K.vax.VITA[i + 1]; const closes = next ? K.d.addMonths(k.dob, next.m) : K.d.addMonths(k.dob, 60 + 6);
    let st; if (date) st = 'given'; else if (K.d.cmp(today, closes) >= 0) st = 'missed'; else { const lag = K.d.diff(due, today); st = lag < 0 ? 'upcoming' : lag <= 28 ? 'due' : 'overdue'; }
    return { v, date, alb, due, st, albDose: v.m < 24 ? '200 mg' : '400 mg' };
  });
};
K.vax.counts = (st) => { const vals = Object.values(st).filter(s => s.st !== 'na' && s.st !== 'upcoming' && s.st !== 'waiting'); return { n: vals.filter(s => s.st === 'given').length, t: vals.length }; };
K.vax.fic = (k, st) => {
  const ids = ['BCG', 'OPV1', 'OPV2', 'OPV3', 'Penta1', 'Penta2', 'Penta3', 'MR1'];
  if (!ids.every(id => st[id] && st[id].st === 'given')) return null;
  const last = ids.map(id => st[id].date).sort().pop();
  const fic = K.d.cmp(last, K.d.addMonths(k.dob, 12)) <= 0 ? 'fic' : 'ficLate';
  const cicIds = ['MR2', 'DPTB1', 'OPVB'];
  const cic = cicIds.every(id => st[id] && st[id].st === 'given') && K.d.cmp(cicIds.map(id => st[id].date).sort().pop(), K.d.addMonths(k.dob, 24)) <= 0;
  return { fic, cic, date: last };
};
/* the next group a mother should bring the child for */
K.vax.nextGroup = (k, st, today) => {
  today = today || K.d.today();
  const live = Object.values(st).filter(s => ['due', 'overdue', 'upcoming'].includes(s.st));
  if (!live.length) return null;
  const over = live.filter(s => s.st === 'overdue');
  const first = live.slice().sort((a, b) => K.d.cmp(a.due, b.due))[0];
  const ref = over.length ? over : live.filter(s => K.d.diff(first.due, s.due) <= 14);
  return { items: ref, date: ref.map(s => s.due).sort()[0], status: over.length ? 'overdue' : first.st };
};
K.vax.lbl = (s) => ({ given: K.t('st.given'), due: K.t('st.due'), overdue: K.t('st.overdue'), upcoming: K.t('st.upcoming'), waiting: K.t('vax.later'), missed: K.t('st.missed'), na: K.t('st.na') }[s.st]);
K.vax.tone = (s) => ({ given: 'ok', due: 'due', overdue: 'over', upcoming: 'soon', waiting: 'soon', missed: 'red', na: 'soon' }[s.st]);

/* doses recorded before their due date (more than 4 days early) or ahead of the previous dose get a confirm, not a block */

  ids.forEach(id => {

  });
  return msgs;
};

K.forms.vitaSave = async (v, f) => {
  const [cid, kid, n] = f.dataset.arg.split('|'); const c = K.card.load(cid); const k = c && K.card.findKid(c, kid); if (!k) return;
  k.vitA = k.vitA || {}; k.alb = k.alb || {};
  if (v.vitA) k.vitA[n] = v.vitA; if (v.alb) k.alb[n] = v.alb;
  await K.store.save(c); K.ui.sheet.close(); K.ui.toast(K.t('saved')); K.refresh();
};
K.acts.vitaRemove = async (el) => { const [cid, kid, n] = el.dataset.arg.split('|'); const c = K.card.load(cid); const k = c && K.card.findKid(c, kid); if (!k) return; delete (k.vitA || {})[n]; delete (k.alb || {})[n]; await K.store.save(c); K.ui.sheet.close(); K.refresh(); };

/* ---------------------------------------------------------------- child overview section + card pill */
K.child.addSection(10, (c, k) => {
  if (!k.dob) return '';
  const st = K.vax.state(k); const nx = K.vax.nextGroup(k, st); const cnt = K.vax.counts(st); const fic = K.vax.fic(k, st);
  const url = K.child.url(c, k, '/vax');
  return h`<section class="sec">${K.ui.secH(K.t('vax.title'), h`<a class="link" href="${url}">${K.t('see.all')}</a>`)}
    <a class="k-card vax-sum" href="${url}">
      ${nx ? h`<div class="vs-top"><span class="eyebrow" style="margin:0">${nx.status === 'overdue' ? K.t('vax.overdue') : K.t('vax.next')}</span>${K.ui.pill(K.d.rel(nx.date), nx.status === 'overdue' ? 'over' : nx.status === 'due' ? 'due' : 'soon')}</div>
        <div class="vs-codes">${nx.items.map(s => h`<span class="vcode-chip">${s.it.code}</span>`)}</div>
        <span class="small">${K.d.weekday(nx.date)}, ${K.d.fmt(nx.date, 'long')}</span>` : h`<span class="small">${K.t('vax.allDone')}</span>`}
      <div class="vs-foot"><span class="small">${K.t('vax.progress', { n: cnt.n, t: cnt.t })}</span>${fic ? K.ui.pill(K.t(fic.cic ? 'vax.cic' : 'vax.' + fic.fic), 'ok', 'shield') : ''}</div>
      ${K.ui.bar(cnt.t ? cnt.n / cnt.t * 100 : 0, cnt.n < cnt.t ? 'amber' : '')}
    </a></section>`;
});
K.child.cardBits.push((c, k) => {
  if (!k.dob) return '';
  const nx = K.vax.nextGroup(k, K.vax.state(k)); if (!nx) return '';
  if (nx.status === 'overdue') return K.ui.pill(K.t('vax.overdue'), 'over', 'syringe');
  if (K.d.diff(K.d.today(), nx.date) <= 14) return K.ui.pill(`${nx.items[0].it.code}${nx.items.length > 1 ? ' +' + K.digits(nx.items.length - 1) : ''} · ${K.d.fmt(nx.date, 'dm')}`, nx.status === 'due' ? 'due' : 'soon', 'syringe');
  return '';
});

/* ---------------------------------------------------------------- due items */
K.due.add((c, today) => {
  const out = [];
  K.card.kids(c).forEach(k => {
    if (!k.dob) return;
    const st = K.vax.state(k, today);
    const over = Object.values(st).filter(s => s.st === 'overdue');
    const href = K.child.url(c, k, '/vax');
    if (over.length) out.push({ id: 'vaxo' + k.id, kind: 'vax', icon: 'syringe', href, who: K.child.label(k), status: 'overdue', date: over.map(s => s.due).sort()[0],
      title: { en: `${K.child.label(k)}: overdue vaccines ${over.map(s => s.it.code).join(', ')}`, or: `${K.child.label(k)}: ବିଳମ୍ବ ଟୀକା ${over.map(s => s.it.code).join(', ')}` } });
    const soon = Object.values(st).filter(s => s.st === 'due' || (s.st === 'upcoming' && K.d.diff(today, s.due) <= 45));
    const groups = {}; soon.forEach(s => { (groups[s.due] = groups[s.due] || []).push(s); });
    Object.entries(groups).forEach(([d, list]) => out.push({ id: 'vax' + k.id + d, kind: 'vax', icon: 'syringe', href, who: K.child.label(k), date: d,
      title: { en: `${K.child.label(k)}: ${list.map(s => s.it.code).join(', ')}`, or: `${K.child.label(k)}: ${list.map(s => s.it.code).join(', ')} ଟୀକା` } }));
    const va = K.vax.vitaState(k, today).find(x => x.st === 'due' || x.st === 'overdue' || (x.st === 'upcoming' && K.d.diff(today, x.due) <= 30));
    if (va) out.push({ id: 'vita' + k.id, kind: 'vax', icon: 'drop', href: href + '#vita', who: K.child.label(k), date: va.due, status: va.st === 'overdue' ? 'overdue' : undefined,
      title: { en: `${K.child.label(k)}: ${va.v.code}${va.v.alb ? ' + albendazole' : ''}`, or: `${K.child.label(k)}: ${va.v.code}${va.v.alb ? ' + କୃମିନାଶକ' : ''}` } });
  });
  return out;
});
K.summary.add((c) => K.card.kids(c).filter(k => k.dob).map(k => { const st = K.vax.state(k); const nx = K.vax.nextGroup(k, st); const cnt = K.vax.counts(st);
  return `${K.child.label(k)} — ${K.t('vax.progress', { n: cnt.n, t: cnt.t })}${nx ? `; ${K.t('vax.next')}: ${nx.items.map(s => s.it.code).join(', ')} (${K.d.fmt(nx.date)})` : ''}`; }));

}

K.growth = {};
const seg = (ind, sex, x) => { const segs = K.who[ind] && K.who[ind][sex]; if (!segs) return null; for (const s of segs) if (x >= s[0][0] && x <= s[s.length - 1][0]) return s; return null; };
K.growth.lms = (ind, sex, x) => {
  const s = seg(ind, sex, x); if (!s) return null;
  let lo = 0, hi = s.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (s[mid][0] <= x) lo = mid; else hi = mid; }
  const a = s[lo], b = s[hi]; const t = b[0] === a[0] ? 0 : (x - a[0]) / (b[0] - a[0]);
  return [a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];
};
K.growth.val = (lms, z) => { const [L, M, S] = lms; return Math.abs(L) < 1e-7 ? M * Math.exp(S * z) : M * Math.pow(1 + L * S * z, 1 / L); };
K.growth.z = (y, lms, restricted) => {
  if (!lms || y == null || y <= 0) return null; const [L, M, S] = lms;
  let z = Math.abs(L) < 1e-7 ? Math.log(y / M) / S : (Math.pow(y / M, L) - 1) / (L * S);
  if (restricted) {
    const sd = k => K.growth.val(lms, k);
    if (z > 3) z = 3 + (y - sd(3)) / (sd(3) - sd(2));
    else if (z < -3) z = -3 + (y - sd(-3)) / (sd(-2) - sd(-3));
  }
  return z;
};
K.growth.defRange = (ageD) => (ageD <= 330 ? '1' : ageD <= 700 ? '2' : '5');
K.growth.sex = k => (k.sex === 'm' ? 1 : k.sex === 'f' ? 2 : null);
K.growth.ageDays = (k, date) => { const dob = K.child.useCorrected(k, date) ? K.child.correctedDob(k) : k.dob; return Math.max(0, K.d.diff(dob, date)); };

/* all indicators for one measurement */
K.growth.assess = (k, m) => {
  const sex = K.growth.sex(k); if (!sex || !k.dob || !m || !m.date) return null;
  const age = K.growth.ageDays(k, m.date); const r = { age, corrected: K.child.useCorrected(k, m.date) };
  const wt = K.num(m.wt), ht0 = K.num(m.ht), hc = K.num(m.hc), muac = K.num(m.muac); const oed = +m.oedema === 1;
  if (age > 1826) r.over5 = true;
  if (wt != null && age <= 1826 && !oed) r.waz = K.growth.z(wt, K.growth.lms('wfa', sex, age), true);
  if (ht0 != null) {
    let ht = ht0; const pos = m.pos || (age < 731 ? 'L' : 'H');
    if (age < 731 && pos === 'H') ht += 0.7; else if (age >= 731 && pos === 'L') ht -= 0.7;
    r.ht = ht;
    if (age <= 1826) r.haz = K.growth.z(ht, K.growth.lms('lhfa', sex, age), false);
    if (wt != null && !oed) { const ind = age < 731 ? 'wfl' : 'wfh'; const l = K.growth.lms(ind, sex, Math.round(ht * 10) / 10); if (l) r.whz = K.growth.z(wt, l, true); r.whInd = ind; }
    if (wt != null && !oed && age <= 1826) r.baz = K.growth.z(wt / Math.pow(ht / 100, 2), K.growth.lms('bfa', sex, age), true);
  }
  if (hc != null && age <= 1826) r.hcz = K.growth.z(hc, K.growth.lms('hcfa', sex, age), false);
  if (muac != null && age >= 182 && age <= 1826) r.muacCls = muac < 11.5 ? 'sam' : muac < 12.5 ? 'mam' : 'n';
  r.oedema = oed;
  // WHO implausible-value flags
  r.flag = (r.waz != null && (r.waz < -6 || r.waz > 5)) || (r.haz != null && (r.haz < -6 || r.haz > 6)) || (r.whz != null && (r.whz < -5 || r.whz > 5)) || (r.hcz != null && (r.hcz < -5 || r.hcz > 5));
  // headline
  const sam = oed || r.muacCls === 'sam' || (r.whz != null && r.whz < -3);
  const mam = !sam && (r.muacCls === 'mam' || (r.whz != null && r.whz < -2));
  r.sam = sam; r.mam = mam;
  r.zone = r.waz == null ? null : r.waz < -3 ? 's' : r.waz < -2 ? 'm' : r.waz > 2 ? 'hi' : 'n';
  r.tone = sam || r.zone === 's' ? 'red' : (mam || r.zone === 'm') ? 'amber' : r.zone === 'hi' ? 'info' : 'teal';
  return r;
};
K.growth.latest = (k, field = 'wt') => (k.growth || []).filter(m => m[field] != null).sort(K.by('date', -1))[0] || null;
K.growth.faltering = (k) => {
  const ws = (k.growth || []).filter(m => m.wt != null).sort(K.by('date', -1));
  if (ws.length < 2) return false; const a = ws[0], b = ws.find(x => K.d.diff(x.date, a.date) >= 21);
  if (!b || K.d.diff(b.date, a.date) > 75) return false;
  return a.wt <= b.wt && K.d.diff(k.dob, a.date) < 1096; // < 3 years
};
K.growth.headline = (r) => {
  if (!r) return null;
  if (r.sam) return { tone: 'red', t: K.t('gr.sam') };
  if (r.zone === 's') return { tone: 'red', t: K.t('gr.zone.s') };
  if (r.mam) return { tone: 'amber', t: K.t('gr.mam') };
  if (r.zone === 'm') return { tone: 'amber', t: K.t('gr.zone.m') };
  if (r.zone === 'hi') return { tone: 'info', t: K.t('gr.zone.hi') };
  if (r.zone === 'n') return { tone: 'teal', t: K.t('gr.zone.n') };
  return null;
};
const zs = (z) => (z == null ? '–' : K.digits((z >= 0 ? '+' : '') + z.toFixed(2)));

/* ---------------------------------------------------------------- chart */
K.growth.chart = (k, ind, range) => {
  const sex = K.growth.sex(k); if (!sex) return '';
  const byAge = ind !== 'wfh';
  const ageNow = K.d.diff(k.dob, K.d.today());
  let x0, x1, xs, ind2 = ind;
  if (byAge) { const maxD = range === '1' ? 365 : range === '2' ? 730 : 1826; x0 = 0; x1 = maxD; }
  else { const ap = ageNow < 731; ind2 = ap ? 'wfl' : 'wfh'; x0 = ap ? 45 : 65; x1 = ap ? (range === '1' ? 85 : 110) : 120; }
  const step = byAge ? Math.max(7, Math.round((x1 - x0) / 120)) : 0.5;
  xs = []; for (let x = x0; x <= x1 + 1e-9; x += step) xs.push(+x.toFixed(1)); if (xs[xs.length - 1] < x1) xs.push(x1);
  const zl = ind === 'wfh' ? [-3, -2, -1, 0, 1, 2, 3] : [-3, -2, 0, 2, 3];
  const segInd = (x) => (ind2 === 'lhfa' && x === 730.5 ? 730 : x);
  const line = (z) => xs.map(x => { const l = K.growth.lms(ind2, sex, segInd(x)); return l ? [x, K.growth.val(l, z)] : null; }).filter(Boolean);
  const L = {}; [-3, -2, -1, 0, 1, 2, 3].forEach(z => { L[z] = line(z); });
  // points
  const pts = (k.growth || []).filter(m => m.date).sort(K.by('date')).map(m => {
    const r = K.growth.assess(k, m); if (!r) return null;
    if (ind === 'wfa' && m.wt != null && !r.oedema) return { x: r.age, y: +m.wt, m };
    if (ind === 'lhfa' && r.ht != null) return { x: r.age, y: r.ht, m };
    if (ind === 'hcfa' && m.hc != null) return { x: r.age, y: +m.hc, m };
    if (ind === 'wfh' && m.wt != null && r.ht != null && !r.oedema) return { x: r.ht, y: +m.wt, m };
    return null;
  }).filter(p => p && p.x >= x0 && p.x <= x1);
  const ys = L[-3].map(p => p[1]).concat(L[3].map(p => p[1]), pts.map(p => p.y));
  let y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys));
  const W = 360, H = 268, ML = 34, MR = 24, MT = 10, MB = 30;
  const X = x => ML + (x - x0) / (x1 - x0) * (W - ML - MR), Y = y => MT + (1 - (y - y0) / (y1 - y0)) * (H - MT - MB);
  const poly = (arr) => arr.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  const band = (lo, hi) => `${poly(lo)} ${poly(hi.slice().reverse())}`;
  const bottom = L[-3].map(p => [p[0], y0]), top = L[3].map(p => [p[0], y1]);
  // ticks
  const xt = []; if (byAge) { const stepM = x1 <= 365 ? 1 : x1 <= 730 ? 3 : 6; for (let m = 0; m * 30.4375 <= x1 + 1; m += stepM) xt.push({ v: m * 30.4375, l: K.digits(m), yr: m % 12 === 0 }); }
  else { for (let v = Math.ceil(x0 / 5) * 5; v <= x1; v += 5) xt.push({ v, l: K.digits(v), yr: v % 10 === 0 }); }
  const yStep = (y1 - y0) > 30 ? 5 : (y1 - y0) > 12 ? 2 : 1; const yt = []; for (let v = Math.ceil(y0 / yStep) * yStep; v <= y1; v += yStep) yt.push(v);
  const yLabel = ind === 'wfa' || ind === 'wfh' ? K.t('gr.kg') : ind === 'hcfa' ? K.t('gr.hcAxis') : K.t('gr.cmAxis');
  const xLabel = byAge ? K.t('gr.ageAxis') : K.t('gr.cmAxis');
  const lastP = pts[pts.length - 1];
  return h`<svg class="gchart ${sex === 2 ? 'girl' : 'boy'}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${K.t('gr.' + ind)}">
    <rect x="${ML}" y="${MT}" width="${W - ML - MR}" height="${H - MT - MB}" class="bg"/>
    ${ind === 'wfa' ? h`<polygon class="b-s" points="${band(bottom, L[-3])}"/><polygon class="b-m" points="${band(L[-3], L[-2])}"/><polygon class="b-n" points="${band(L[-2], L[2])}"/>`
      : h`<polygon class="b-s" points="${band(bottom, L[-3])}"/><polygon class="b-m" points="${band(L[-3], L[-2])}"/><polygon class="b-n" points="${band(L[-2], L[2])}"/><polygon class="b-hi" points="${band(L[2], top)}"/>`}
    ${yt.map(v => h`<line class="gl" x1="${ML}" x2="${W - MR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="tk" x="${ML - 5}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${K.digits(v)}</text>`)}
    ${xt.map(t => h`<line class="${t.yr ? 'gl yr' : 'gl'}" x1="${X(t.v).toFixed(1)}" x2="${X(t.v).toFixed(1)}" y1="${MT}" y2="${H - MB}"/><text class="tk" x="${X(t.v).toFixed(1)}" y="${H - MB + 13}" text-anchor="middle">${t.l}</text>`)}
    ${zl.map(z => h`<polyline class="zl z${z < 0 ? 'm' + -z : z}" points="${poly(L[z])}"/><text class="zt" x="${W - MR + 3}" y="${(Y(L[z][L[z].length - 1][1]) + 3.5).toFixed(1)}">${K.digits(z)}</text>`)}
    ${pts.length > 1 ? h`<polyline class="pl" points="${pts.map(p => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ')}"/>` : ''}
    ${pts.map(p => h`<circle class="${p === lastP ? 'pt last' : 'pt'}" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p === lastP ? 5 : 3.6}"/>`)}
    <text class="ax" x="${(ML + W - MR) / 2}" y="${H - 3}" text-anchor="middle">${xLabel}</text>
    <text class="ax" transform="translate(10 ${(MT + H - MB) / 2}) rotate(-90)" text-anchor="middle">${yLabel}</text>
  </svg>`;
};

const LINE = (d) => h`<svg viewBox="0 0 30 14" aria-hidden="true"><polyline points="${d}"/></svg>`;
K.growth.legend = (ind) => {
  const zones = ind === 'wfa'
    ? [['n', K.t('gr.zone.n')], ['m', K.t('gr.zone.m')], ['s', K.t('gr.zone.s')]]
    : [['n', K.t('gr.lg.normal')], ['m', K.t('gr.lg.m')], ['s', K.t('gr.lg.s')], ['hi', K.t('gr.lg.hi')]];
  return h`<div class="legend">${zones.map(([c, t]) => h`<span><i class="lg-${c}"></i>${t}</span>`)}</div>
    ${ind === 'wfa' ? h`<div class="gr-lines"><b>${K.t('gr.curve')}</b><span class="up">${LINE('2,12 10,8 18,5 28,2')}${K.t('gr.curve.up')}</span><span class="flat">${LINE('2,7 28,7')}${K.t('gr.curve.flat')}</span><span class="down">${LINE('2,9 10,5 18,5 28,11')}${K.t('gr.curve.down')}</span></div>` : ''}`;
};

/* ---------------------------------------------------------------- screens */
K.route('/card/:id/child/:kid/growth', ({ id, kid }, q) => {
  const c = K.card.load(id); if (!c) return K.screens.notFound(); const k = K.card.findKid(c, kid); if (!k) return K.screens.notFound();
  const back = K.child.url(c, k).slice(1);
  if (!K.growth.sex(k) || !k.dob) return { title: K.t('gr.title'), back, html: h`<div class="wrap">${K.ui.callout('warn', '', K.t('gr.need'))}<p></p>${K.ui.btn(K.t('child.edit'), { href: K.child.url(c, k, '/edit'), tone: 'ghost' })}</div>` };
  const ind = q.get('i') || 'wfa'; const ageD = K.d.diff(k.dob, K.d.today());
  const range = q.get('r') || K.growth.defRange(ageD);

  const base = K.child.url(c, k, '/growth');

    title: K.t('gr.title'), sub: K.child.label(k), back, tab: 'home',
    html: h`<div class="wrap">${K.ui.phead(K.child.label(k) + ' · ' + K.d.ageText(k.dob), K.t('gr.title'), K.t('gr.monthly'))}
      ${hl ? K.ui.callout(hl.tone === 'red' ? 'danger' : hl.tone === 'amber' ? 'warn' : hl.tone === 'info' ? 'info' : '', hl.t,
        hl.tone === 'red' ? (r.sam ? K.t('gr.samDo') : K.t('gr.adv.s')) : hl.tone === 'amber' ? K.t('gr.adv.m') : (K.growth.faltering(k) ? K.t('gr.falter') : K.t('gr.good')), hl.tone === 'teal' ? 'check' : null) : ''}
      ${K.growth.faltering(k) && hl && hl.tone !== 'teal' ? h`<p></p>${K.ui.callout('warn', '', K.t('gr.falter'))}` : ''}
      <p></p>${K.ui.btn(K.t('gr.add'), { href: K.child.url(c, k, '/growth/new'), icon: 'plus', block: true })}
      <section class="sec" style="margin-top:16px">
        <div class="seg-grid">${K.ui.seg(tabs, ind)}</div>
        <div class="k-card chart-card"><div class="chart-h"><b>${K.t('gr.' + ind)} · ${K.t(k.sex === 'f' ? 'sex.f' : 'sex.m')}</b><span class="small faint">${K.t('gr.who')}</span></div>
          ${K.growth.chart(k, ind, range)}
          ${ranges.length ? h`<div style="margin-top:8px">${K.ui.seg(ranges, range)}</div>` : ''}
          ${K.growth.legend(ind)}
          ${k.sex === 'f' ? h`<p class="small faint" style="margin:8px 0 0">${K.t('gr.equal')}</p>` : ''}
        </div>
      </section>
      <section class="sec">${K.ui.secH(K.t('gr.history'))}
        ${list.length ? h`<div class="table gr-table"><table><thead><tr><th>${K.t('date')}</th><th>${K.t('u.kg')}</th><th>${K.t('u.cm')}</th>${hcp ? h`<th>WAZ</th><th>HAZ</th><th>WHZ</th>` : h`<th></th>`}</tr></thead><tbody>
          ${list.map(m => { const a = K.growth.assess(k, m) || {}; const hl2 = K.growth.headline(a);
            return h`<tr data-act="grEdit" data-arg="${c.id}|${k.id}|${m.id}" class="tap"><td class="num">${K.d.fmt(m.date, 'tbl')}${a.corrected ? '*' : ''}<small>${K.d.diff(k.dob, m.date) === 0 ? K.L(K.vax.VISITS[0].name) : K.d.ageText(k.dob, m.date, { days: false, noWeeks: true })}</small></td><td class="num">${m.wt != null ? K.n(m.wt, 2) : '–'}</td><td class="num">${m.ht != null ? K.n(m.ht, 1) : '–'}</td>
              ${hcp ? h`<td class="num ${a.waz != null && a.waz < -2 ? 'neg' : ''}">${zs(a.waz)}</td><td class="num ${a.haz != null && a.haz < -2 ? 'neg' : ''}">${zs(a.haz)}</td><td class="num ${a.whz != null && a.whz < -2 ? 'neg' : ''}">${zs(a.whz)}</td>`
                : h`<td>${hl2 ? K.ui.pill(hl2.t.replace(/ \(.+\)/, ''), hl2.tone === 'teal' ? 'ok' : hl2.tone === 'amber' ? 'due' : hl2.tone === 'red' ? 'over' : 'info') : ''}</td>`}</tr>`; })}
        </tbody></table></div>${list.some(m => (K.growth.assess(k, m) || {}).corrected) ? h`<p class="small faint">* ${K.t('gr.corrected')}</p>` : ''}` : K.ui.empty('scale', K.t('gr.none'))}

K.route('/card/:id/child/:kid/growth/:mid', ({ id, kid, mid }) => {

K.growth.resultHtml = (k, r) => {

K.live.grPreview = K.debounce(() => {
  const f = K.$('form[data-form="grSave"]'); if (!f) return; const c = K.card.load(f.dataset.id); const k = c && K.card.findKid(c, f.dataset.kid); if (!k) return;
  const v = K.formData(f); if (v.ht != null && v.ht < 30) v.ht = null; if (v.wt != null && v.wt > 60) v.wt = v.wt / 1000; const m = Object.assign({ date: K.d.today() }, v);
  const r = (m.wt != null || m.ht != null || m.hc != null || m.muac != null || m.oedema) ? K.growth.assess(k, m) : null;
  K.$('#gr-preview').innerHTML = K.hv(r ? h`<h3 style="margin:4px 0 8px">${K.t('anc.result')}</h3>${K.growth.resultHtml(k, r)}` : '');

K.forms.grSave = async (v, f) => {
  const c = K.card.load(f.dataset.id); const k = c && K.card.findKid(c, f.dataset.kid); if (!k) return;

  let wt = v.wt; if (wt != null && wt > 60) wt = wt / 1000; // grams typed
  let m = f.dataset.mid ? (k.growth || []).find(x => x.id === f.dataset.mid) : null;
  if (!m) { m = { id: K.uid('g') }; (k.growth = k.growth || []).push(m); }
  Object.assign(m, { date: v.date, wt: wt != null ? K.round(wt, 3) : null, ht: v.ht != null ? v.ht : null, pos: v.pos || '', muac: v.muac != null ? v.muac : null, hc: v.hc != null ? v.hc : null, oedema: v.oedema == null ? null : +v.oedema });

K.acts.grDelete = async (el) => {

K.child.addSection(20, (c, k) => {
  if (!k.dob) return '';
  const last = K.growth.latest(k); const r = last ? K.growth.assess(k, last) : null; const hl = K.growth.headline(r);
  const url = K.child.url(c, k, '/growth');
  return h`<section class="sec">${K.ui.secH(K.t('gr.title'), h`<a class="link" href="${url}">${K.t('see.all')}</a>`)}
    <a class="k-card gr-sum" href="${url}">
      ${last ? h`<div class="gr-top"><div><span class="mono gr-w">${K.n(last.wt, 2)} ${K.t('u.kg')}</span><span class="small faint">${K.d.fmt(last.date)} · ${K.d.rel(last.date)}</span></div>${hl ? K.ui.pill(hl.t.replace(/ \(.+\)/, ''), hl.tone === 'teal' ? 'ok' : hl.tone === 'amber' ? 'due' : hl.tone === 'red' ? 'over' : 'info') : ''}</div>
        ${K.growth.sex(k) ? K.growth.chart(k, 'wfa', K.growth.defRange(K.d.diff(k.dob, K.d.today()))) : ''}
        ${K.growth.faltering(k) ? K.ui.callout('warn', '', K.t('gr.falter')) : ''}` : h`<span class="small">${K.t('gr.none')}</span>`}
    </a>
    <p style="margin:8px 0 0">${K.ui.btn(K.t('gr.add'), { href: K.child.url(c, k, '/growth/new'), tone: 'ghost', size: 'sm', icon: 'plus' })}</p></section>`;
});
K.child.cardBits.push((c, k) => {
  const last = K.growth.latest(k); if (!last) return '';
  const hl = K.growth.headline(K.growth.assess(k, last)); if (!hl || hl.tone === 'teal') return '';
  return K.ui.pill(hl.t.replace(/ \(.+\)/, ''), hl.tone === 'amber' ? 'due' : hl.tone === 'red' ? 'over' : 'info', 'scale');
});
K.due.add((c, today) => {
  const out = [];
  K.card.kids(c).forEach(k => {
    if (!k.dob) return; const age = K.d.age(k.dob, today); if (age.months >= 60) return;
    const last = K.growth.latest(k); const every = age.months < 36 ? 1 : 3;
    const date = last ? K.d.addMonths(last.date, every) : K.d.addMonths(k.dob, 1);
    if (K.d.diff(today, date) <= 10) out.push({ id: 'wt' + k.id, kind: 'growth', icon: 'scale', href: K.child.url(c, k, '/growth/new'), who: K.child.label(k), date: K.d.cmp(date, k.dob) < 0 ? today : date,
      title: { en: `${K.child.label(k)}: weigh at the Anganwadi centre`, or: `${K.child.label(k)}: ଅଙ୍ଗନୱାଡ଼ି କେନ୍ଦ୍ରରେ ଓଜନ` } });
    const r = last && K.growth.assess(k, last);
    if (r && r.sam) out.push({ id: 'sam' + k.id, kind: 'danger', icon: 'alert', href: K.child.url(c, k, '/growth'), who: K.child.label(k), date: last.date, status: 'overdue',

  });
  return out;
});
K.summary.add((c) => K.card.kids(c).map(k => { const m = K.growth.latest(k); if (!m) return ''; const hl = K.growth.headline(K.growth.assess(k, m)); return `${K.child.label(k)}: ${K.n(m.wt, 2)} kg (${K.d.fmt(m.date)})${hl ? ' · ' + hl.t : ''}`; }));

K.backup = {
  async build(cardIds) {
    const cards = K.store.list().filter(c => !cardIds || cardIds.includes(c.id)).map(K.copy);
    const media = (await K.db.all('media') || []).filter(m => cards.some(c => c.id === m.cardId));
    const s = K.settings.data;
    return { app: 'kavach', format: 1, exportedAt: new Date().toISOString(), build: K.build, cards, media,
      settings: cardIds ? undefined : { lang: s.lang, mode: s.mode, district: s.district, jeArea: s.jeArea, ifaDays: s.ifaDays, odiaNum: s.odiaNum } };
  },
  fileName(cardName) { return `kavach-${cardName ? String(cardName).replace(/[^\w଀-୿]+/g, '-').slice(0, 30) + '-' : 'backup-'}${K.d.today()}.json`; },
  async file(cardIds, name) { const data = await this.build(cardIds); return new File([JSON.stringify(data)], this.fileName(name), { type: 'application/json' }); },
  async parse(file) {
    const txt = await file.text(); let d;
    try { d = JSON.parse(txt); } catch (e) { return null; }
    if (!d || d.app !== 'kavach' || !Array.isArray(d.cards)) return null;
    return d;
  },
  plan(d) {
    const out = { add: [], upd: [], same: [] };
    d.cards.forEach(c => { if (!c || !c.id || !c.mother) return; const cur = K.store.card(c.id);
      if (!cur) out.add.push(c); else if ((c.updatedAt || '') > (cur.updatedAt || '')) out.upd.push(c); else out.same.push(c); });
    return out;
  },
  async apply(d) {
    const p = this.plan(d); let n = 0;
    for (const c0 of [...p.add, ...p.upd]) {
      const c = K.migrate ? K.migrate(c0) : c0; delete c.deletedAt; c.updatedAt = c.updatedAt || new Date().toISOString();
      await K.db.put('cards', c);
      const i = K.store.cards.findIndex(x => x.id === c.id); if (i >= 0) K.store.cards[i] = c; else K.store.cards.push(c);
      n++;
    }
    const have = new Set((await K.db.all('media') || []).map(m => m.id));
    for (const m of (d.media || [])) if (m && m.id && !have.has(m.id)) await K.db.put('media', m);
    K.bus.emit('cards');
    return n;
  },
};

K.route('/backup', () => {
  const lb = K.settings.get('lastBackup');
  const canShareFiles = !!(navigator.canShare && window.File && navigator.canShare({ files: [new File(['x'], 'x.json', { type: 'application/json' })] }));
  return {
    title: K.t('bk.title'), back: '/more', tab: 'more',
    html: h`<div class="wrap">${K.ui.phead('', K.t('bk.title'), K.t('bk.lede'))}
      <p class="small">${lb ? K.t('bk.last', { d: K.d.fmt(lb.slice(0, 10), 'long') }) : K.t('bk.never')}</p>
      <div class="list">
        ${K.ui.li({ act: 'bkSave', icon: 'download', title: K.t('bk.save'), meta: K.t('bk.saveSub') })}
        ${canShareFiles ? K.ui.li({ act: 'bkShare', icon: 'share', title: K.t('bk.share'), meta: K.t('bk.shareSub') }) : ''}
        <label class="li" for="bk-file"><span class="lead info">${K.ui.icon('upload')}</span><span class="body"><span class="t">${K.t('bk.restore')}</span><span class="m">${K.t('bk.restoreSub')}</span></span><span class="trail">${K.ui.icon('chev', 'sm')}</span></label>
      </div>
      <input type="file" id="bk-file" accept="application/json,.json" hidden data-live="bkPick">
      <div id="bk-preview"></div>
      <section class="sec" style="margin-top:22px">${K.ui.eyebrow(K.t('bk.storage'))}
        <p class="small">${K.store.persisted ? K.t('bk.persist') : K.t('bk.notPersist')} · <span class="mono">${K.db.mode()}</span></p></section>
    </div>`,
  };
});
const stamp = () => K.settings.set('lastBackup', new Date().toISOString());
K.acts.bkSave = async () => { const f = await K.backup.file(); K.download(f.name, f); stamp(); K.ui.toast(K.t('saved')); setTimeout(K.refresh, 600); };
K.acts.bkShare = async () => {
  const f = await K.backup.file();
  try { await navigator.share({ files: [f], title: K.t('app.name') }); stamp(); K.refresh(); }
  catch (e) { if (e && e.name !== 'AbortError') { K.download(f.name, f); stamp(); } }
};
K.live.bkPick = async (el) => {
  const file = el.files && el.files[0]; if (!file) return;
  const d = await K.backup.parse(file); const box = K.$('#bk-preview');
  if (!d) { box.innerHTML = K.hv(K.h`<p></p>${K.ui.callout('danger', '', K.t('bk.badFile'))}`); return; }
  const p = K.backup.plan(d); K.backup._pending = d;
  box.innerHTML = K.hv(K.h`<p></p>${K.ui.callout('info', file.name, K.h`<p>${K.t('bk.preview', { n: d.cards.length, add: p.add.length, upd: p.upd.length, same: p.same.length })}</p>
    <p style="margin-top:10px">${K.ui.btn(K.t('bk.import'), { act: 'bkImport', icon: 'upload', disabled: !(p.add.length + p.upd.length) })}</p>`, 'upload')}`);
  el.value = '';
};
K.acts.bkImport = async () => { const d = K.backup._pending; if (!d) return; const n = await K.backup.apply(d); K.backup._pending = null;
  if (d.settings && !K.store.list().length) Object.entries(d.settings).forEach(([k, v]) => v != null && K.settings.set(k, v));
  K.ui.toast(K.t('bk.done', { n })); K.go('/'); };

/* ---------------------------------------------------------------- one card: file + text summary */
K.acts.cardFile = async (el) => {
  const c = K.card.load(el.dataset.arg); if (!c) return;
  const f = await K.backup.file([c.id], c.mother.name);
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: c.mother.name }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  K.download(f.name, f);
};
K.card.summaryText = (c) => {
  const m = c.mother; const lines = [`${K.t('sum.title')} — ${m.name || ''}`];
  const idl = [m.village, m.rchId ? 'RCH ' + m.rchId : '', m.phone].filter(Boolean).join(' · '); if (idl) lines.push(idl);
  K.summary.providers.forEach(p => { try { (p(c) || []).forEach(l => l && lines.push(l)); } catch (e) { console.error(e); } });
  const due = K.due.forCard(c).filter(i => i.days <= 30).slice(0, 6);
  if (due.length) { lines.push(''); lines.push(K.t('card.next') + ':'); due.forEach(i => lines.push(`• ${K.L(i.title)} — ${K.d.fmt(i.date)} (${K.due.label(i)})`)); }
  lines.push(''); lines.push(`${K.t('app.name')} · #CM-APP`);
  return lines.join('\n');
};
K.acts.shareCard = async (el) => {
  const c = K.card.load(el.dataset.arg); if (!c) return;
  const text = K.card.summaryText(c);
  if (navigator.share) { try { await navigator.share({ title: K.t('sum.title'), text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  K.ui.sheet.open(K.h`<h2>${K.t('sum.title')}</h2><div class="field"><textarea id="sum-txt" rows="12" readonly>${text}</textarea></div><p></p>
    <div class="btn-row">${K.ui.btn(K.t('sum.copy'), { act: 'copySummary', icon: 'check' })}${K.ui.btn(K.t('bk.cardFile'), { act: 'cardFile', arg: c.id, tone: 'ghost', icon: 'download' })}</div>`);
};
K.acts.copySummary = async () => { const t = K.$('#sum-txt'); try { await navigator.clipboard.writeText(t.value); } catch (e) { t.select(); document.execCommand && document.execCommand('copy'); } K.ui.toast(K.t('sum.copied')); };

}
/* ── main.js ── */
{
/* ============================================================================
   main — boot sequence
   ============================================================================ */
(async function boot() {
  K.settings.load();
  K.speech.init();
  try { await K.store.init(); } catch (e) { console.error(e); }
  if (K.db.mode() !== 'idb') setTimeout(() => K.ui.toast(K.t('warn.storage'), 6000), 1200);
  K.bus.on('storage-warning', () => K.ui.toast(K.t('warn.storage'), 6000));
  K.bus.on('cards', () => K.ui.updateBadges());
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW', err));
  }
  if (!K.settings.get('onboarded') && K.path() !== '/welcome') { history.replaceState(null, '', '#/welcome'); }
  await K.render();
})();

}
})();
